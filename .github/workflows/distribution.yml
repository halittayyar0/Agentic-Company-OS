name: Portable distribution
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: portable-distribution-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Publish immutable multi-platform image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx build --platform linux/amd64,linux/arm64 --tag "$image:sha-$GITHUB_SHA" --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" --label "org.opencontainers.image.revision=$GITHUB_SHA" --metadata-file /tmp/image-metadata.json --push .
          digest=$(jq -r '."containerimage.digest"' /tmp/image-metadata.json)
          test "${digest#sha256:}" != "$digest"
          echo "RELEASE_IMAGE=$image@$digest" >> "$GITHUB_ENV"
      - name: Prove installation and resume from the published image
        run: pnpm exec tsx scripts/src/setup/container-install-smoke.ts "$RELEASE_IMAGE"
      - name: Package the standalone installer
        run: |
          node scripts/build-setup.mjs --image "$RELEASE_IMAGE" --commit "$GITHUB_SHA" --out /tmp/Agentic-Company-OS-setup
          cd /tmp
          zip -r Agentic-Company-OS-setup.zip Agentic-Company-OS-setup
          sha256sum Agentic-Company-OS-setup.zip > SETUP-SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: portable-setup
          path: |
            /tmp/Agentic-Company-OS-setup.zip
            /tmp/SETUP-SHA256SUMS.txt
            /tmp/image-metadata.json
          if-no-files-found: error
          retention-days: 30
