name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, audit, test, typecheck, and build
    runs-on: ubuntu-latest
    # Recorded source + browser baselines and the new route matrix exceed
    # 36 minutes locally, before setup, native database checks and retries.
    timeout-minutes: 60
    env:
      CI: true
    services:
      postgres:
        image: postgres:17-bookworm@sha256:051f7b7b3abdd564d5d1bd1e8c4b9c1b6e77087d1dd22020ede611c096a272e0
        env:
          POSTGRES_DB: agentic_os_ci
          POSTGRES_USER: agentic_ci
          POSTGRES_PASSWORD: agentic_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentic_ci -d agentic_os_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install pinned pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm run format:check

      - name: Audit production dependencies
        run: pnpm run security:audit

      - name: Check production dependency licenses
        run: pnpm --filter @workspace/scripts run check:licenses

      - name: Test
        run: pnpm test

      - name: Verify generated API artifacts
        run: |
          pnpm --filter @workspace/api-spec run codegen
          git diff --exit-code -- lib/api-client-react/src/generated lib/api-zod/src/generated lib/api-zod/src/index.ts

      - name: Smoke-test clean database migrations
        run: pnpm --filter @workspace/db run migrate

      - name: Apply migrations to PostgreSQL
        env:
          DATABASE_URL: postgresql://agentic_ci:agentic_ci_password@127.0.0.1:5432/agentic_os_ci
        run: pnpm --filter @workspace/db run migrate

      - name: Prove PostgreSQL task-lease lock ordering
        env:
          DATABASE_URL: postgresql://agentic_ci:agentic_ci_password@127.0.0.1:5432/agentic_os_ci
          POSTGRES_RACE_TEST_DISPOSABLE: "1"
        run: >-
          node --import tsx --test
          artifacts/api-server/src/lib/orchestrator/task-lease-postgres.test.ts

      - name: Prove PostgreSQL operation-receipt race convergence
        env:
          DATABASE_URL: postgresql://agentic_ci:agentic_ci_password@127.0.0.1:5432/agentic_os_ci
          POSTGRES_RACE_TEST_DISPOSABLE: "1"
          POSTGRES_RACE_TEST_FAIL_IF_SKIPPED: "1"
        run: >-
          node --import tsx --test
          artifacts/api-server/src/lib/orchestrator/operation-receipts-postgres.test.ts

      - name: Prove PostgreSQL operator request ownership across processes
        env:
          DATABASE_URL: postgresql://agentic_ci:agentic_ci_password@127.0.0.1:5432/agentic_os_ci
          POSTGRES_RACE_TEST_DISPOSABLE: "1"
          POSTGRES_RACE_TEST_FAIL_IF_SKIPPED: "1"
        run: >-
          node --import tsx --test
          artifacts/api-server/src/lib/operator-requests-postgres.test.ts

      - name: Prove PostgreSQL sampler ownership and cross-connection file locks
        env:
          DATABASE_URL: postgresql://agentic_ci:agentic_ci_password@127.0.0.1:5432/agentic_os_ci
          POSTGRES_RACE_TEST_DISPOSABLE: "1"
        run: >-
          node --import tsx --test --test-concurrency=1 --test-timeout=60000
          --test-name-pattern="PostgreSQL advisory ownership|native PostgreSQL file writers"
          artifacts/api-server/src/lib/operations/operations-sampler.test.ts
          artifacts/api-server/src/lib/vm/file-editing.test.ts

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Install UI smoke browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run UI release smoke
        run: pnpm exec playwright test --config playwright.config.ts

      - name: Enforce frontend bundle budget
        run: pnpm --filter @workspace/scripts run check:bundle

  windows-runtime:
    name: Windows runtime and process-tree regression
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install pinned pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download and verify portable PostgreSQL 17
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "postgresql-17.10-1-windows-x64-binaries.zip"
          $postgresRoot = Join-Path $env:RUNNER_TEMP "postgresql-17.10-1-windows-x64-binaries"
          Invoke-WebRequest `
            -Uri "https://get.enterprisedb.com/postgresql/postgresql-17.10-1-windows-x64-binaries.zip" `
            -OutFile $archive
          $actualSize = (Get-Item -LiteralPath $archive).Length
          if ($actualSize -ne 333925750) {
            throw "Portable PostgreSQL archive size mismatch"
          }
          $expected = "f9aafca58e7026a1ef2caeee711acf761671e57904d430adc85f468374f5a821"
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "Portable PostgreSQL SHA256 mismatch"
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $postgresRoot
          $postgresExecutable = Join-Path $postgresRoot "pgsql\bin\postgres.exe"
          $version = & $postgresExecutable --version
          if ($LASTEXITCODE -ne 0 -or $version -notmatch "PostgreSQL\) 17\.[0-9]+") {
            throw "Portable PostgreSQL is not a supported 17.x toolchain"
          }
          "ENDURANCE_POSTGRES_ROOT=$postgresRoot" >> $env:GITHUB_ENV

      - name: Test Windows runtime paths
        run: pnpm test

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build native runtime artifacts from the frozen lockfile
        run: pnpm run build

      - name: Install native endurance observer browser
        run: pnpm exec playwright install chromium

      - name: Exercise native PostgreSQL process topology
        run: >-
          pnpm endurance:native-postgres-smoke --
          --postgres-root "$env:ENDURANCE_POSTGRES_ROOT"
          --output artifacts/endurance-reports/windows-native-smoke.json
          --overwrite

      - name: Prove native wall-clock evidence and verifier path
        shell: pwsh
        run: |
          pnpm endurance:wall-clock:native -- `
            --postgres-root "$env:ENDURANCE_POSTGRES_ROOT" `
            --duration-hours 0.03333333333333333 `
            --fault-profile compressed-all `
            --seed 240901 `
            --output artifacts/endurance-reports/windows-native-wall-clock.json `
            --overwrite
          $runnerStatus = $LASTEXITCODE
          if ($runnerStatus -ne 1) {
            throw "Expected a valid short wall-clock run to exit 1, received $runnerStatus"
          }
          pnpm endurance:verify-report -- `
            artifacts/endurance-reports/windows-native-wall-clock.json `
            --expect-mode wall_clock `
            --expect-commit "$env:GITHUB_SHA" `
            --expect-runtime native-postgres `
            --allow-unverified-duration

  container:
    name: Build and exercise production and endurance containers
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install pinned pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install endurance driver dependencies
        run: pnpm install --frozen-lockfile

      - name: Compute exact source tree identity
        id: source-identity
        run: echo "source-tree-sha256=$(git ls-tree -r --full-tree HEAD | sha256sum | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Build runtime image
        run: docker build --pull --tag agentic-company-os:ci .

      - name: Build dedicated endurance image
        run: |
          docker build --pull \
            --target endurance-runtime \
            --build-arg ENDURANCE_SOURCE_COMMIT_SHA="$GITHUB_SHA" \
            --build-arg ENDURANCE_SOURCE_TREE_SHA256="${{ steps.source-identity.outputs.source-tree-sha256 }}" \
            --tag agentic-company-os:endurance-ci \
            .

      - name: Prove ordinary production image rejects synthetic mode
        run: |
          set +e
          docker run --rm \
            --env DATABASE_URL=postgresql://agentic:unused_password@127.0.0.1:1/agentic_os \
            --env OPERATOR_AUTH_TOKEN=agentic_ci_operator_token_32_chars_minimum \
            --env RUNTIME_CONTROL_KEY=agentic_ci_runtime_control_key_32_chars_minimum \
            --env RUNTIME_ROLE=api \
            --env SCHEDULER_ENABLED=false \
            --env SYNTHETIC_RUNTIME_ENABLED=true \
            --env ENDURANCE_MODE=soak \
            --env ENDURANCE_RUN_ID=ordinary-image-rejection \
            --env ENDURANCE_RUN_DIR=/app/endurance-control \
            --env SYNTHETIC_RUNTIME_CONTROL_FILE=/app/endurance-control/fault-control.json \
            agentic-company-os:ci > /tmp/ordinary-synthetic-rejection.log 2>&1
          status=$?
          set -e
          cat /tmp/ordinary-synthetic-rejection.log
          test "$status" -ne 0
          grep --fixed-strings --quiet \
            'Synthetic runtime is forbidden in production without the dedicated endurance image attestation.' \
            /tmp/ordinary-synthetic-rejection.log

      - name: Smoke-test external runtime dependencies
        run: >-
          docker run --rm --entrypoint node agentic-company-os:ci
          --input-type=module -e
          "await import('@electric-sql/pglite'); await import('playwright-core');"

      - name: Smoke-test Chromium sandbox profile
        run: >-
          docker run --rm --read-only --cap-drop ALL
          --security-opt no-new-privileges:true --security-opt seccomp=./deploy/chromium-seccomp.json --shm-size 1gb
          --tmpfs /tmp:size=512m,mode=1777
          --entrypoint /usr/bin/chromium agentic-company-os:ci
          --headless --disable-gpu --no-first-run
          --user-data-dir=/tmp/chromium-ci --dump-dom about:blank

      - name: Start production-profile dependencies
        run: |
          docker network create agentic-ci
          docker run --detach --name agentic-ci-db --network agentic-ci \
            --env POSTGRES_DB=agentic_os \
            --env POSTGRES_USER=agentic \
            --env POSTGRES_PASSWORD=agentic_ci_password \
            postgres:17-bookworm@sha256:051f7b7b3abdd564d5d1bd1e8c4b9c1b6e77087d1dd22020ede611c096a272e0
          for attempt in $(seq 1 30); do
            docker exec agentic-ci-db pg_isready -U agentic -d agentic_os && exit 0
            sleep 1
          done
          docker logs agentic-ci-db
          exit 1

      - name: Start production-profile application
        run: |
          docker run --detach --name agentic-ci-app --network agentic-ci --network-alias app \
            --publish 127.0.0.1:5000:5000 \
            --read-only --cap-drop ALL --security-opt no-new-privileges:true --security-opt seccomp=./deploy/chromium-seccomp.json \
            --shm-size 1gb --tmpfs /tmp:size=512m,mode=1777 \
            --tmpfs /home/node/.cache:size=256m,uid=1000,gid=1000,mode=0700 \
            --env DATABASE_URL=postgresql://agentic:agentic_ci_password@agentic-ci-db:5432/agentic_os \
            --env OPERATOR_AUTH_TOKEN=agentic_ci_operator_token_32_chars_minimum \
            --env RUNTIME_CONTROL_KEY=agentic_ci_runtime_control_key_32_chars_minimum \
            --env RUNTIME_ROLE=api \
            --env SCHEDULER_ENABLED=false \
            --env ALLOW_REMOTE_ACCESS=true \
            --env TRUSTED_HOSTS=127.0.0.1,localhost,app \
            --env CORS_ALLOWED_ORIGINS=http://127.0.0.1:5000 \
            agentic-company-os:ci
          for attempt in $(seq 1 60); do
            curl --fail --silent http://127.0.0.1:5000/api/readyz && exit 0
            sleep 1
          done
          docker logs agentic-ci-app
          exit 1

      - name: Start two independent production workers
        run: |
          for worker in 1 2; do
            docker run --detach --name "agentic-ci-worker-${worker}" --network agentic-ci \
              --read-only --no-healthcheck --cap-drop ALL --security-opt no-new-privileges:true --security-opt seccomp=./deploy/chromium-seccomp.json \
              --shm-size 1gb --tmpfs /tmp:size=512m,mode=1777 \
              --tmpfs /home/node/.cache:size=256m,uid=1000,gid=1000,mode=0700 \
              --env DATABASE_URL=postgresql://agentic:agentic_ci_password@agentic-ci-db:5432/agentic_os \
              --env RUNTIME_CONTROL_KEY=agentic_ci_runtime_control_key_32_chars_minimum \
              --env RUNTIME_CONTROL_API_URL=http://app:5000/api/internal/runtime-control \
              --env RUNTIME_ROLE=worker \
              --env SCHEDULER_ENABLED=true \
              --env HOST=127.0.0.1 \
              --env ALLOW_REMOTE_ACCESS=false \
              --env SERVE_STATIC_UI=false \
              agentic-company-os:ci \
              node --enable-source-maps artifacts/api-server/start-worker.mjs
          done
          ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent \
              --header 'Authorization: Bearer agentic_ci_operator_token_32_chars_minimum' \
              http://127.0.0.1:5000/api/ops/instances > /tmp/agentic-instances.json \
              && node --input-type=module -e '
                import fs from "node:fs";
                const value = JSON.parse(fs.readFileSync("/tmp/agentic-instances.json", "utf8"));
                const healthy = value.instances.filter((item) => item.effectiveState === "healthy");
                if (healthy.filter((item) => item.role === "api").length !== 1) process.exit(1);
                if (healthy.filter((item) => item.role === "worker").length !== 2) process.exit(1);
              '; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            docker logs agentic-ci-app
            docker logs agentic-ci-worker-1
            docker logs agentic-ci-worker-2
            exit 1
          fi

      - name: Prove worker death is visible and replacement rejoins
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const value = JSON.parse(fs.readFileSync("/tmp/agentic-instances.json", "utf8"));
            const workerIds = value.instances
              .filter((item) => item.role === "worker" && item.effectiveState === "healthy")
              .map((item) => item.id);
            if (workerIds.length !== 2) process.exit(1);
            fs.writeFileSync("/tmp/agentic-initial-worker-ids.json", JSON.stringify(workerIds));
          '
          docker kill agentic-ci-worker-1
          stale=false
          for attempt in $(seq 1 45); do
            if curl --fail --silent \
              --header 'Authorization: Bearer agentic_ci_operator_token_32_chars_minimum' \
              http://127.0.0.1:5000/api/ops/instances > /tmp/agentic-instances-after-kill.json \
              && node --input-type=module -e '
                import fs from "node:fs";
                const initial = JSON.parse(fs.readFileSync("/tmp/agentic-initial-worker-ids.json", "utf8"));
                const value = JSON.parse(fs.readFileSync("/tmp/agentic-instances-after-kill.json", "utf8"));
                const original = value.instances.filter((entry) => initial.includes(entry.id));
                if (original.filter((item) => item.effectiveState === "stale").length !== 1) process.exit(1);
                if (original.filter((item) => item.effectiveState === "healthy").length !== 1) process.exit(1);
              '; then
              stale=true
              break
            fi
            sleep 1
          done
          test "$stale" = true
          docker start agentic-ci-worker-1
          recovered=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent \
              --header 'Authorization: Bearer agentic_ci_operator_token_32_chars_minimum' \
              http://127.0.0.1:5000/api/ops/instances > /tmp/agentic-instances-recovered.json \
              && node --input-type=module -e '
                import fs from "node:fs";
                const initial = JSON.parse(fs.readFileSync("/tmp/agentic-initial-worker-ids.json", "utf8"));
                const value = JSON.parse(fs.readFileSync("/tmp/agentic-instances-recovered.json", "utf8"));
                const workers = value.instances.filter((item) => item.role === "worker" && item.effectiveState === "healthy");
                if (workers.length !== 2 || !workers.some((item) => !initial.includes(item.id))) process.exit(1);
              '; then
              recovered=true
              break
            fi
            sleep 1
          done
          test "$recovered" = true

      - name: Verify static UI and authentication boundary
        run: |
          curl --fail --silent http://127.0.0.1:5000/ | grep --quiet '<div id="root"></div>'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:5000/api/settings/llm)" = "401"
          curl --fail --silent --dump-header /tmp/agentic-login-headers \
            --header 'Content-Type: application/json' \
            --data '{"token":"agentic_ci_operator_token_32_chars_minimum"}' \
            http://127.0.0.1:5000/api/auth/login
          grep --ignore-case --quiet 'set-cookie:.*HttpOnly.*Secure.*SameSite=Strict' /tmp/agentic-login-headers
          curl --fail --silent \
            --header 'Authorization: Bearer agentic_ci_operator_token_32_chars_minimum' \
            http://127.0.0.1:5000/api/settings/llm

      - name: Stop production profile cleanly
        run: docker stop --time 25 agentic-ci-worker-1 agentic-ci-worker-2 agentic-ci-app

      - name: Print production logs on failure
        if: failure()
        run: |
          docker logs agentic-ci-app 2>&1 || true
          docker logs agentic-ci-worker-1 2>&1 || true
          docker logs agentic-ci-worker-2 2>&1 || true
          docker logs agentic-ci-db 2>&1 || true

      - name: Remove production smoke resources
        if: always()
        run: |
          docker rm --force agentic-ci-worker-1 agentic-ci-worker-2 agentic-ci-app agentic-ci-db 2>/dev/null || true
          docker network rm agentic-ci 2>/dev/null || true

      - name: Install endurance observer browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Prove dedicated image accepts a PostgreSQL-backed ten-agent workload
        env:
          APP_PORT: "5100"
          DATABASE_URL: postgresql://agentic:agentic_ci_soak_password@db:5432/agentic_os
          OPERATOR_AUTH_TOKEN: agentic_ci_soak_operator_token_32_chars_minimum
          RUNTIME_CONTROL_KEY: agentic_ci_soak_runtime_control_key_32_chars_minimum
          POSTGRES_PASSWORD: agentic_ci_soak_password
          AGENTIC_POSTGRES_IMAGE: postgres:17-bookworm@sha256:051f7b7b3abdd564d5d1bd1e8c4b9c1b6e77087d1dd22020ede611c096a272e0
          ENDURANCE_PREBUILT_IMAGE: "true"
          ENDURANCE_RUNTIME_IMAGE: agentic-company-os:endurance-ci
          ENDURANCE_SOURCE_COMMIT_SHA: ${{ github.sha }}
          ENDURANCE_SOURCE_TREE_SHA256: ${{ steps.source-identity.outputs.source-tree-sha256 }}
        run: |
          mkdir -p artifacts/endurance-reports
          set +e
          pnpm endurance:wall-clock -- \
            --duration-hours 0.03333333333333333 \
            --fault-profile compressed-all \
            --seed 240901 \
            --output artifacts/endurance-reports/ci-postgres-smoke.json \
            --overwrite
          runner_status=$?
          set -e
          # A valid short run is intentionally nonzero because it cannot claim verified24h.
          test "$runner_status" -eq 1
          pnpm endurance:verify-report -- \
            artifacts/endurance-reports/ci-postgres-smoke.json \
            --expect-mode wall_clock \
            --expect-commit "$GITHUB_SHA" \
            --expect-runtime docker-compose \
            --allow-unverified-duration
