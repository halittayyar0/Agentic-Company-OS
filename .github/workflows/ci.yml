name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coding-container:
    name: Retained proc prototype (not product acceptance)
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pinned pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install frozen test dependencies
        run: pnpm install --frozen-lockfile
      - name: Build optional coding image
        run: docker build --pull --target coding-runtime --tag agentic-company-os:coding-ci .
      - name: Require AppArmor and load only the dedicated coding profile
        run: |
          docker info --format '{{json .SecurityOptions}}' | grep --quiet 'name=apparmor'
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends apparmor
          sudo apparmor_parser -r -W deploy/agentic-coding.apparmor
      - name: Prove image-owned CLI permissions and cleanup without inference or skips
        env:
          ACOS_CODING_CONTAINER_SMOKE: "1"
          ACOS_CODING_REQUIRE_APPARMOR: "1"
        run: |
          image_id=$(docker image inspect --format '{{.Id}}' agentic-company-os:coding-ci)
          pnpm test:coding:container "$image_id"
      - name: Prove actual coding installation, stopped-service resume and database restore
        run: pnpm exec tsx scripts/src/setup/container-install-smoke.ts --coding-source
      - name: Diagnose namespace setup under the unchanged coding boundary
        if: failure()
        run: |
          docker run --rm --pull=never --network=none --read-only --user=1000:1000 \
            --cap-drop=ALL --pids-limit=128 --security-opt=no-new-privileges:true \
            --security-opt=seccomp="$GITHUB_WORKSPACE/deploy/coding-seccomp.json" \
            --security-opt=apparmor=agentic-coding \
            --tmpfs=/tmp:rw,exec,nosuid,size=64m,mode=1777 --env=HOME=/tmp \
            agentic-company-os:coding-ci \
            /usr/bin/bwrap --unshare-user --unshare-pid --die-with-parent \
            --as-pid-1 --new-session --ro-bind / / --proc /proc --dev /dev --tmpfs /tmp \
            -- /usr/bin/python3 -I -S -c 'import json,os; print(json.dumps({"pid":os.getpid()}))' \
            > "$RUNNER_TEMP/coding-namespace-probe.log" 2>&1 || true
          cat "$RUNNER_TEMP/coding-namespace-probe.log"
      - name: Preserve dedicated profile denials on failure
        if: failure()
        run: >-
          sudo journalctl -k --since '-30 minutes' --no-pager
          | grep -E 'apparmor=.*DENIED.*(profile|peer)="agentic-coding[^"]*"'
          > "$RUNNER_TEMP/coding-apparmor-denials.log" || true
      - name: Preserve offline container evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coding-container-offline-evidence
          path: |
            /tmp/acos-coding-container-*/evidence.json
            /tmp/acos-coding-container-*/native-tests.log
            /tmp/acos-container-install-proof-*/evidence.json
            ${{ runner.temp }}/coding-apparmor-denials.log
            ${{ runner.temp }}/coding-namespace-probe.log
          if-no-files-found: warn

  windows-owner-probe:
    name: Empty owned Windows ACL diagnostic (not product acceptance)
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Check out fixed diagnostic source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Exercise exact protection script on newly owned empty fixtures
        shell: pwsh
        run: |
          $source = Get-Content -LiteralPath lib/ai-server/src/owner-private-storage.ts -Raw
          $matched = [regex]::Match($source, 'const WINDOWS_PROTECTION_SCRIPT = String.raw`(?<program>[\s\S]*?)`;')
          if (-not $matched.Success) { throw 'Missing fixed protection script' }
          $root = Join-Path $env:RUNNER_TEMP ('acos-owner-probe-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $root -ErrorAction Stop | Out-Null
          $program = $matched.Groups['program'].Value
          $encoded = [Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes($program))
          $powershell = Join-Path $env:SystemRoot 'System32/WindowsPowerShell/v1.0/powershell.exe'
          $env:ACOS_PRIVATE_STORAGE_TARGET = $root
          $env:ACOS_PRIVATE_STORAGE_DIRECTORY = '1'
          $env:ACOS_PRIVATE_STORAGE_CREATE = '1'
          & $powershell -NoLogo -NoProfile -NonInteractive -EncodedCommand $encoded
          $directoryCode = $LASTEXITCODE
          $file = Join-Path $root 'empty-fixture'
          New-Item -ItemType File -Path $file -ErrorAction Stop | Out-Null
          $env:ACOS_PRIVATE_STORAGE_TARGET = $file
          $env:ACOS_PRIVATE_STORAGE_DIRECTORY = '0'
          $env:ACOS_PRIVATE_STORAGE_CREATE = '0'
          & $powershell -NoLogo -NoProfile -NonInteractive -EncodedCommand $encoded
          $fileCode = $LASTEXITCODE
          $observations = foreach ($path in @($root, $file)) {
            $acl = Get-Acl -LiteralPath $path
            @{kind=$(if($path -eq $root){'directory'}else{'empty-file'});owner=$acl.GetOwner([Security.Principal.SecurityIdentifier]).Value;protected=$acl.AreAccessRulesProtected;rules=@($acl.GetAccessRules($true,$true,[Security.Principal.SecurityIdentifier]) | ForEach-Object {@{sid=$_.IdentityReference.Value;rights=$_.FileSystemRights.ToString();type=$_.AccessControlType.ToString();inherited=$_.IsInherited;propagation=$_.PropagationFlags.ToString()}})}
          }
          @{directoryCode=$directoryCode;fileCode=$fileCode;user=[Security.Principal.WindowsIdentity]::GetCurrent().User.Value;observations=$observations} | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath "$env:RUNNER_TEMP/acos-fixed-owner-probe.json"
          Get-Content -LiteralPath "$env:RUNNER_TEMP/acos-fixed-owner-probe.json"
          # Every file is an empty uniquely owned runner fixture. No secret data.
          $global:LASTEXITCODE = 0
      - name: Preserve observations without waiving private storage validation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fixed-windows-owner-diagnostic
          path: ${{ runner.temp }}/acos-fixed-owner-probe.json
          if-no-files-found: error
