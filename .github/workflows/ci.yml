name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixed-proc-diagnostic:
    name: Fixed offline proc mount diagnostic (not product acceptance)
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Check out fixed diagnostic source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Record kernel and container runtime
        run: |
          uname -a
          docker version
          docker info
      - name: Build the pinned optional coding image
        run: docker build --pull --target coding-runtime --tag agentic-company-os:fixed-probe .
      - name: Require AppArmor and load scoped diagnostic profiles
        run: |
          docker info --format '{{json .SecurityOptions}}' | grep --quiet 'name=apparmor'
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends apparmor
          sudo apparmor_parser -r -W deploy/agentic-coding.apparmor
          # This second profile runs ONLY the fixed image-owned PID JSON probe.
          # No agent, account, secret, model, host bind or production change.
          cat > "$RUNNER_TEMP/agentic-coding-fixed-probe.apparmor" <<'PROFILE'
          abi <abi/3.0>,
          #include <tunables/global>
          profile agentic-coding-fixed-probe flags=(attach_disconnected,mediate_deleted) {
            #include <abstractions/base>
            file,
            capability,
            mount,
            umount,
            pivot_root,
            signal,
            ptrace (trace,tracedby,read,readby) peer=agentic-coding-fixed-probe,
          }
          PROFILE
          sudo apparmor_parser -r -W "$RUNNER_TEMP/agentic-coding-fixed-probe.apparmor"
      - name: Compare two profiles with all Docker proc masks and limits retained
        run: |
          image_id=$(docker image inspect --format '{{.Id}}' agentic-company-os:fixed-probe)
          common=(--rm --pull=never --network=none --read-only --user=1000:1000 --cap-drop=ALL --pids-limit=128 --security-opt=no-new-privileges:true --security-opt="seccomp=$GITHUB_WORKSPACE/deploy/coding-seccomp.json" --tmpfs=/tmp:rw,exec,nosuid,size=64m,mode=1777 --env=HOME=/tmp)
          for profile in agentic-coding agentic-coding-fixed-probe; do
            set +e
            docker run "${common[@]}" --security-opt="apparmor=$profile" "$image_id" \
              /usr/bin/bwrap --unshare-user --unshare-pid --die-with-parent \
              --as-pid-1 --new-session --ro-bind / / --proc /proc --dev /dev --tmpfs /tmp \
              -- /usr/bin/python3 -I -S -c 'import json,os;print(json.dumps({"pid":os.getpid(),"namespace":os.readlink("/proc/self/ns/pid")}))' \
              > "$RUNNER_TEMP/$profile-proc.log" 2>&1
            status=$?
            set -e
            printf 'profile=%s exit=%s\n' "$profile" "$status"
            cat "$RUNNER_TEMP/$profile-proc.log"
          done
          docker run "${common[@]}" --security-opt=apparmor=agentic-coding "$image_id" \
            /usr/bin/python3 -I -S -c 'import json,os;print(json.dumps({"uid":os.getuid(),"mounts":open("/proc/self/mountinfo").read(),"status":open("/proc/self/status").read()}))' \
            > "$RUNNER_TEMP/coding-fixed-container-boundary.json"
      - name: Preserve bounded kernel diagnostics
        if: always()
        run: |
          sudo dmesg --color=never | grep -E 'apparmor=.*DENIED.*agentic-coding' > "$RUNNER_TEMP/coding-fixed-dmesg.log" || true
          sudo journalctl -k --since '-20 minutes' --no-pager | grep -E 'apparmor=.*DENIED.*agentic-coding' > "$RUNNER_TEMP/coding-fixed-journal.log" || true
          cat "$RUNNER_TEMP/coding-fixed-dmesg.log"
      - name: Preserve diagnostics without marking native tests passed
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fixed-proc-diagnostic
          path: |
            ${{ runner.temp }}/*-proc.log
            ${{ runner.temp }}/coding-fixed-*.json
            ${{ runner.temp }}/coding-fixed-*.log
          if-no-files-found: error
