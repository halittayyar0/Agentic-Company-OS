name: Windows compiler diagnosis (isolated diagnostic branch)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-compiler-diagnosis:
    name: Public-source Windows suite with bounded compiler metadata
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      AGENT_BROWSER_CHANNEL: chromium
    steps:
      - name: Check out diagnostic source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install pinned pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Confirm unchanged public production boundary
        shell: pwsh
        run: |
          git diff --exit-code 3b5d6ef5111c4479bb5b6305beb7fae9c3857da9 -- artifacts/api-server/src/lib/vm/windows-owned-job.ts artifacts/api-server/src/lib/vm/windows-owned-job-source.ts artifacts/api-server/src/lib/vm/windows-owned-job.test.ts lib/ai-server/src/owner-private-storage.ts scripts/src/run-tests.ts
          if ($LASTEXITCODE -ne 0) { throw 'Production diagnostic boundary changed' }
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Install browser used by the original suite
        run: pnpm exec playwright install chromium
      - name: Observe full original suite without raising compiler timeout or skipping tests
        shell: pwsh
        env:
          TEST_CONCURRENCY: "1"
          TEST_DISABLE_WASM_CODE_GC: "1"
        run: |
          $observer = node --input-type=module -e "import {pathToFileURL} from 'node:url'; import path from 'node:path'; console.log(pathToFileURL(path.resolve('scripts/src/testing/windows-compiler-observer.mjs')).href)"
          if ($LASTEXITCODE -ne 0) { throw 'Diagnostic observer resolution failed' }
          $env:NODE_OPTIONS = "--import=$observer"
          pnpm test
