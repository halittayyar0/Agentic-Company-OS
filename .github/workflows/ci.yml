name: Ordinary Windows fixture diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    name: DIAGNOSTIC ONLY ordinary Windows account launch
    runs-on: windows-2025
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
          cache: pnpm
      - name: Install only the frozen test-driver dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Prepare deliberately invalid diagnostic archive
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'deliberately-not-a-native-package.zip'
          [IO.File]::WriteAllText($archive, 'DIAGNOSTIC ONLY. Deliberately invalid archive. No application or release payload.')
          "NATIVE_PACKAGE_ARCHIVE=$archive" >> $env:GITHUB_ENV
          "NATIVE_PACKAGE_EVIDENCE=$(Join-Path $env:RUNNER_TEMP 'native-windows-fixture-diagnostic.json')" >> $env:GITHUB_ENV
          $python = Get-Command python.exe -CommandType Application | Select-Object -First 1
          "PYTHON=$($python.Source)" >> $env:GITHUB_ENV
      - name: Diagnose the actual CI-only ordinary-user launch
        run: |
          & (Join-Path $env:SystemRoot 'System32/WindowsPowerShell/v1.0/powershell.exe') -NoLogo -NoProfile -NonInteractive -File scripts/test-native-package-windows.ps1
          $helperExit = $LASTEXITCODE
          $sidecar = Get-Content -LiteralPath ($env:NATIVE_PACKAGE_EVIDENCE + '.windows-fixture.json') -Raw | ConvertFrom-Json
          if ($sidecar.accepted -eq $true) { throw 'An invalid diagnostic archive must never qualify as a release' }
          if ($helperExit -eq 0) { throw 'Deliberately invalid archive unexpectedly accepted' }
          if ($sidecar.failurePhase -ne 'archive_acceptance' -or $sidecar.ordinaryUserVerified -ne $true -or $sidecar.cleanupVerified -ne $true) { throw 'The ordinary-user launch diagnostic did not reach the expected invalid archive refusal' }
          'DIAGNOSTIC ONLY: ordinary identity reached the expected invalid archive refusal; no native package qualified.'
          exit 0
      - name: Retain only safe diagnostic receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ordinary-windows-launch-diagnostic
          path: |
            ${{ runner.temp }}/native-windows-fixture-diagnostic.json
            ${{ runner.temp }}/native-windows-fixture-diagnostic.json.windows-fixture.json
          if-no-files-found: warn
          retention-days: 14
