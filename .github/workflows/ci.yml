name: Windows full runtime diagnosis

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-runtime:
    name: Windows runtime and process-tree regression
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      AGENT_BROWSER_CHANNEL: chromium
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install pinned pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download and verify portable PostgreSQL 17
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "postgresql-17.10-1-windows-x64-binaries.zip"
          $postgresRoot = Join-Path $env:RUNNER_TEMP "postgresql-17.10-1-windows-x64-binaries"
          Invoke-WebRequest `
            -Uri "https://get.enterprisedb.com/postgresql/postgresql-17.10-1-windows-x64-binaries.zip" `
            -OutFile $archive
          $actualSize = (Get-Item -LiteralPath $archive).Length
          if ($actualSize -ne 333925750) {
            throw "Portable PostgreSQL archive size mismatch"
          }
          $expected = "f9aafca58e7026a1ef2caeee711acf761671e57904d430adc85f468374f5a821"
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "Portable PostgreSQL SHA256 mismatch"
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $postgresRoot
          $postgresExecutable = Join-Path $postgresRoot "pgsql\bin\postgres.exe"
          $version = & $postgresExecutable --version
          if ($LASTEXITCODE -ne 0 -or $version -notmatch "PostgreSQL\) 17\.[0-9]+") {
            throw "Portable PostgreSQL is not a supported 17.x toolchain"
          }
          "ENDURANCE_POSTGRES_ROOT=$postgresRoot" >> $env:GITHUB_ENV

      - name: Install browser for source and native runtime tests
        run: pnpm exec playwright install chromium

      - name: Test Windows runtime paths
        env:
          TEST_CONCURRENCY: "1"
          TEST_DISABLE_WASM_CODE_GC: "1"
        run: pnpm test

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build native runtime artifacts from the frozen lockfile
        run: pnpm run build

      - name: Prove native installation resume and binary backup restoration
        run: pnpm test:installation:native "$env:ENDURANCE_POSTGRES_ROOT/pgsql/bin"

      - name: Prove seven-language first-job connection through real API and workers
        env:
          ACOS_GUIDED_LOCAL_SMOKE: "1"
        run: pnpm test:connection:native "$env:ENDURANCE_POSTGRES_ROOT/pgsql/bin"

      - name: Exercise native PostgreSQL process topology
        run: >-
          pnpm endurance:native-postgres-smoke --
          --postgres-root "$env:ENDURANCE_POSTGRES_ROOT"
          --output artifacts/endurance-reports/windows-native-smoke.json
          --overwrite

      - name: Prove native wall-clock evidence and verifier path
        shell: pwsh
        run: |
          pnpm endurance:wall-clock:native -- `
            --postgres-root "$env:ENDURANCE_POSTGRES_ROOT" `
            --duration-hours 0.16666666666666666 `
            --fault-profile compressed-all `
            --seed 240901 `
            --output artifacts/endurance-reports/windows-native-wall-clock.json `
            --overwrite
          $runnerStatus = $LASTEXITCODE
          if ($runnerStatus -ne 1) {
            throw "Expected a valid short wall-clock run to exit 1, received $runnerStatus"
          }
          # Keep bounded diagnostic results in the job log even when verification fails.
          $report = Get-Content -LiteralPath artifacts/endurance-reports/windows-native-wall-clock.json -Raw | ConvertFrom-Json
          $report | Select-Object pass, verified24h, injections, metrics, assertions | ConvertTo-Json -Depth 8
          pnpm endurance:verify-report -- `
            artifacts/endurance-reports/windows-native-wall-clock.json `
            --expect-mode wall_clock `
            --expect-commit "$env:GITHUB_SHA" `
            --expect-runtime native-postgres `
            --allow-unverified-duration

      - name: Preserve native PostgreSQL evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-native-runtime-evidence
          path: |
            artifacts/endurance-reports/windows-native-smoke.json
            artifacts/endurance-reports/windows-native-wall-clock.json
            artifacts/endurance-reports/windows-native-wall-clock.jsonl
            artifacts/endurance-reports/windows-native-wall-clock.json.sha256
            artifacts/endurance-reports/windows-native-wall-clock.json.browser-manifest.json
            artifacts/endurance-reports/windows-native-wall-clock.json.primary-evidence.jsonl
            artifacts/endurance-reports/windows-native-wall-clock.json.browser/**
          if-no-files-found: warn

