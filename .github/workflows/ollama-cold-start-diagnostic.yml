name: Separate Apple Silicon cold-start diagnostic

on:
  push:
    branches: [codex/ollama-cold-start-diagnostic-20261016]

permissions:
  contents: read

jobs:
  diagnostic:
    name: Observe one cold Ollama bootstrap without release acceptance
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Run the predefined separate cold-start observation once
        env:
          ACOS_OLLAMA_BOUNDARY_SMOKE: "1"
        run: |
          curl --fail --location --retry 2 --max-time 600 \
            --output "$RUNNER_TEMP/ollama-v0.18.0-darwin.tgz" \
            https://github.com/ollama/ollama/releases/download/v0.18.0/ollama-darwin.tgz
          pnpm exec tsx scripts/src/ollama-cold-start-diagnostic.ts \
            "$RUNNER_TEMP/ollama-v0.18.0-darwin.tgz" \
            "$RUNNER_TEMP/ollama-diagnostic-boundary.json" \
            "$RUNNER_TEMP/ollama-cold-start-diagnostic.json"
      - name: Retain the diagnostic outcome and original boundary receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: separate-apple-silicon-cold-start-diagnostic
          path: |
            ${{ runner.temp }}/ollama-diagnostic-boundary.json
            ${{ runner.temp }}/ollama-cold-start-diagnostic.json
          if-no-files-found: error
          retention-days: 7
