name: Windows private checker component

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-private-checker-${{ github.sha }}
  cancel-in-progress: false

jobs:
  native_checker:
    name: Original Windows metadata checker build and conformance
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/windows-private-helper-producer-20261102' && github.run_attempt == 1 && github.event.repository.private == false
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Check out immutable component source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up pinned Node.js without application dependencies
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.22.1
      - name: Build twice with static analysis and warnings as errors
        shell: pwsh
        run: |
          python -B -X utf8 scripts/build-windows-private-helper.py --out (Join-Path $env:RUNNER_TEMP 'checker-build-first')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B -X utf8 scripts/build-windows-private-helper.py --out (Join-Path $env:RUNNER_TEMP 'checker-build-second')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check native creation lifetime and ACL identity behavior
        shell: pwsh
        run: |
          node scripts/check-windows-private-helper-lifetime.mjs (Join-Path $env:RUNNER_TEMP 'checker-build-first') (Join-Path $env:RUNNER_TEMP 'checker-lifetime.json')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/check-windows-private-helper-security.mjs (Join-Path $env:RUNNER_TEMP 'checker-build-first') (Join-Path $env:RUNNER_TEMP 'checker-security.json')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Export only checker and bounded provenance
        shell: pwsh
        run: |
          python -B -X utf8 scripts/export-windows-private-helper-component.py --first (Join-Path $env:RUNNER_TEMP 'checker-build-first') --second (Join-Path $env:RUNNER_TEMP 'checker-build-second') --lifetime (Join-Path $env:RUNNER_TEMP 'checker-lifetime.json') --security (Join-Path $env:RUNNER_TEMP 'checker-security.json') --out (Join-Path $env:RUNNER_TEMP 'windows-private-checker-public')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve validated component only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-private-checker-component
          path: ${{ runner.temp }}/windows-private-checker-public
          if-no-files-found: error
          retention-days: 14
