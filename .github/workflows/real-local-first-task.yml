name: Windows private-helper startup diagnosis

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  diagnostic:
    name: One unchanged handoff case with closed child timings
    if: github.event.repository.private == false && github.ref == 'refs/heads/codex/windows-private-startup-diagnostics'
    runs-on: windows-2025
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    env:
      CI: "true"
    steps:
      - name: Check out exact diagnostic driver
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          path: driver
          persist-credentials: false
      - name: Check out unchanged failed PR97 source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: 72572d0850ba1a8757d0e9e7d84bc51a03208233
          path: application
          persist-credentials: false
      - name: Install pinned pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.17.1
          run_install: false
      - name: Set up pinned diagnostic Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.22.1
          cache: pnpm
          cache-dependency-path: application/pnpm-lock.yaml
      - name: Verify diagnostic behavior and privacy
        working-directory: driver
        run: |
          node --check .github/scripts/windows-private-startup-observer.mjs
          if ($LASTEXITCODE -ne 0) { throw 'observer_syntax_failed' }
          node --test --test-concurrency=1 .github/scripts/windows-private-startup-observer.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'observer_regressions_failed' }
      - name: Install frozen application dependencies
        working-directory: application
        run: |
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { throw 'frozen_dependencies_failed' }
      - name: Observe the unchanged focused case once
        working-directory: application
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          if ((git rev-parse HEAD).Trim() -ne '72572d0850ba1a8757d0e9e7d84bc51a03208233') { throw 'unexpected_application_source' }
          if ((git rev-parse 'HEAD^{tree}').Trim() -ne '160c1b6bc390289956e81fded8abfb7e31a6b911') { throw 'unexpected_application_tree' }
          if (git status --porcelain=v1) { throw 'application_source_changed' }
          $unsafe = Get-ChildItem Env: | Where-Object { $_.Name -match '^(DATABASE_|OPERATOR_AUTH_|RUNTIME_CONTROL_|OPENAI_|OPENROUTER_|AI_INTEGRATIONS_|OLLAMA_|CHATGPT_|ACOS_CODEX_)' -and $_.Value }
          if ($unsafe) { throw 'isolated_synthetic_environment_required' }
          $canonicalTemp = (& node --input-type=module -e "import {realpathSync} from 'node:fs'; console.log(realpathSync(process.argv[1]))" $env:RUNNER_TEMP).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'canonical_temp_required' }
          $env:TEMP = $canonicalTemp
          $env:TMP = $canonicalTemp
          $observer = Join-Path $env:GITHUB_WORKSPACE 'driver/.github/scripts/windows-private-startup-observer.mjs'
          $observerUrl = (& node --input-type=module -e "import {pathToFileURL} from 'node:url'; console.log(pathToFileURL(process.argv[1]).href)" $observer).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'observer_import_url_required' }
          node --input-type=module -e "import os from 'node:os'; console.log(JSON.stringify({platform:process.platform,architecture:process.arch,nodeVersion:process.version,cpus:os.availableParallelism(),totalMemory:os.totalmem(),freeMemory:os.freemem()}))"
          if ($LASTEXITCODE -ne 0) { throw 'capacity_read_failed' }
          $env:ACOS_WINDOWS_STORAGE_OBSERVE = '1'
          node --no-wasm-code-gc --import ./node_modules/tsx/dist/loader.mjs --import $observerUrl --test --test-concurrency=1 --test-timeout=300000 artifacts/api-server/src/lib/chatgpt-handoff-postgres.test.ts
          $focusedExit = $LASTEXITCODE
          Remove-Item Env:ACOS_WINDOWS_STORAGE_OBSERVE
          if (git status --porcelain=v1) { throw 'application_source_changed' }
          if ((git rev-parse HEAD).Trim() -ne '72572d0850ba1a8757d0e9e7d84bc51a03208233') { throw 'application_source_moved' }
          exit $focusedExit
