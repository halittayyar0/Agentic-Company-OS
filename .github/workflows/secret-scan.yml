name: Secret scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 4 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks history scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Use the MIT-licensed CLI directly: no organization license key or
      # JavaScript action runtime is required. Pin both the release and bytes.
      - name: Verify and run Gitleaks
        shell: bash
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          tool_dir="$RUNNER_TEMP/acos-gitleaks"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum --check --strict -
          mkdir -p "$tool_dir"
          tar -xzf "$archive" -C "$tool_dir" gitleaks
          "$tool_dir/gitleaks" dir . --config .gitleaks.toml --no-banner --redact=100 \
            --report-format json --report-path "$RUNNER_TEMP/acos-gitleaks-source.json"
          "$tool_dir/gitleaks" git . --config .gitleaks.toml --no-banner --redact=100 \
            --log-opts='--all --full-history' --report-format json \
            --report-path "$RUNNER_TEMP/acos-gitleaks-history.json"
