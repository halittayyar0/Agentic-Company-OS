name: Platform compatibility

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native_source:
    name: Native source tests ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS Apple Silicon
            runner: macos-15
          - platform: macOS Intel
            runner: macos-15-intel
    env:
      CI: true
      AGENT_BROWSER_CHANNEL: chromium
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pinned pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Install browser for native and UI tests
        run: pnpm exec playwright install chromium
      - name: Test native runtime and filesystem behavior
        run: pnpm test

  native_runtime:
    name: Native installation and UI ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS Apple Silicon
            runner: macos-15
          - platform: macOS Intel
            runner: macos-15-intel
    env:
      CI: true
      AGENT_BROWSER_CHANNEL: chromium
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pinned pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Install browser for native and UI tests
        run: pnpm exec playwright install chromium
      - name: Build application and check types
        run: pnpm run build
      - name: Install PostgreSQL 17 for disposable restore acceptance
        run: |
          brew install postgresql@17
          "$(brew --prefix postgresql@17)/bin/pg_restore" --version
      - name: Prove native installation resume and binary backup restoration
        env:
          TMPDIR: ${{ runner.temp }}
        run: pnpm test:installation:native "$(brew --prefix postgresql@17)/bin"
      - name: Prove seven-language first-job connection through real API and workers
        env:
          ACOS_GUIDED_LOCAL_SMOKE: "1"
          TMPDIR: ${{ runner.temp }}
        run: pnpm test:connection:native "$(brew --prefix postgresql@17)/bin"
      - name: Prove seven-language reusable work through real API and workers
        env:
          ACOS_REUSABLE_GUIDES_SMOKE: "1"
          TMPDIR: ${{ runner.temp }}
        run: pnpm test:guides:native "$(brew --prefix postgresql@17)/bin"
      - name: Verify local database migration
        run: pnpm --filter @workspace/db run migrate
      - name: Exercise first-run and capability library
        run: pnpm exec playwright test --config playwright.config.ts tests/ui/language-setup.spec.ts tests/ui/skills-library.spec.ts --workers 1
      - name: Preserve native installation and guided first-job evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-macos-${{ matrix.platform }}-installation-evidence
          path: |
            ${{ runner.temp }}/acos-native-install-proof-*/evidence.json
            ${{ runner.temp }}/acos-native-install-proof-*/guided-local-runtime-evidence.json
            ${{ runner.temp }}/acos-native-install-proof-*/guided-local-runtime-failure.json
            ${{ runner.temp }}/acos-native-install-proof-*/reusable-project-guides-evidence.json
            ${{ runner.temp }}/acos-native-install-proof-*/reusable-project-guides-cleanup.json
          if-no-files-found: warn
          retention-days: 7

  # A skipped dependency must not turn a required platform check green. Keep
  # the existing protected names and require both complete architecture
  # matrices, including failure/cancellation, before accepting either platform.
  native:
    name: Native ${{ matrix.platform }}
    needs: [native_source, native_runtime]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        platform: [macOS Apple Silicon, macOS Intel]
    steps:
      - name: Require complete source and installation acceptance
        env:
          SOURCE_RESULT: ${{ needs.native_source.result }}
          RUNTIME_RESULT: ${{ needs.native_runtime.result }}
        run: |
          if [ "$SOURCE_RESULT" != "success" ] || [ "$RUNTIME_RESULT" != "success" ]; then
            echo "Source tests: $SOURCE_RESULT; installation and UI: $RUNTIME_RESULT"
            exit 1
          fi
