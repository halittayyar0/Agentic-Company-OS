          type: string
        content:
          type: string
        sizeBytes:
          type: number
        truncated:
          type: boolean
        version:
          type: string
          pattern: "^[a-f0-9]{64}$"
          description: SHA-256 of the complete raw file bytes, including any BOM or original line endings.
        editable:
          type: boolean
          description: True only for a complete lossless UTF-8 snapshot within the 128 KiB editor limit and without NUL bytes.
      required:
        - path
        - content
        - sizeBytes
        - truncated
        - version
        - editable

