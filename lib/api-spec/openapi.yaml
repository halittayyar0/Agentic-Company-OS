  /company-chat/messages:
    get:
      operationId: listCompanyMessages
      tags: [company-chat]
      summary: List real persisted company-channel messages
      parameters:
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/BeforeId"
      responses:
        "200":
          description: Company messages in chronological rendering order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CompanyMessage"
    post:
      operationId: sendCompanyMessage
      tags: [company-chat]
      summary: Post as founder and run a bounded natural group-response round
      description: >
        Persists the founder message first. Explicit @mentions route only to
        those active room members. Without mentions, every active member gets
        a deterministic relevance decision and only likely contributors enter
        a final model-level need-to-reply gate. Membership is unbounded, while
        response attempts, concurrency, and aggregate completion tokens are
        server-bounded; responses never fan out recursively.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyMessageInput"
      responses:
        "200":
          description: Original message receipt; replay never dispatches another model round
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyMessageResponse"
        "201":
          description: Persisted founder message and any real agent responses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyMessageResponse"

  /tasks:
    get:
      operationId: listTasks
