openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0-alpha.1
  description: Agentic Company OS API
servers:
  - url: /api
    description: Base API path
security:
  - operatorBearer: []
  - operatorSession: []
tags:
  - name: skills
    description: Built-in work guides and bounded local utilities
  - name: health
    description: Health operations
  - name: auth
    description: Single-operator authentication
  - name: agents
    description: Agent org chart, templates, and direct chat
  - name: workforces
    description: Reusable multi-agent workforce blueprints and atomic installation
  - name: company-chat
    description: Persistent founder and active-agent company channel
  - name: tasks
    description: Tasks and delegation
  - name: project-meetings
    description: Root-project-scoped meetings, transcripts, decisions, and action items
  - name: activity
    description: Global activity / audit feed
  - name: approvals
    description: Human-in-the-loop approvals
  - name: org
    description: Org-wide summary
  - name: models
    description: LLM providers and model catalog
  - name: settings
    description: Operator-owned provider configuration and connectivity checks
  - name: operations
    description: Persisted runtime safety controls
  - name: vm
    description: Per-agent virtual computer (sandbox filesystem + terminal)
paths:
  /inference-accounting:
    get:
      operationId: getInferenceAccountingStatus
      tags: [operations]
      summary: Inspect model usage accounting without starting or retrying work
      description: Authenticated read-only snapshot. Task scope includes its rooted family and the current owner's unresolved requests. Agent scope includes that agent's requests. Pending means the recorded response window has not elapsed, not verified worker liveness. Clear means no unresolved accounting marker, not task success, budget eligibility or permission to execute. Unknown usage never becomes zero and this endpoint never clears a fence.
      parameters:
        - name: scopeType
          in: query
          required: true
          schema: { type: string, enum: [task, agent] }
        - name: scopeId
          in: query
          required: true
          schema: { type: integer, minimum: 1, maximum: 2147483647 }
      responses:
        "200":
          description: Consistent bounded accounting snapshot
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/InferenceAccountingSnapshot" }
        "400": { description: Invalid scope }
        "401": { description: Operator authentication required }
        "404": { description: Scope missing }
        "503": { description: Status cannot be verified }
  /tasks/{taskId}/coding-session:
    get:
      operationId: getCodexSessionRecovery
      tags: [tasks]
      summary: Read coding-session recovery eligibility without starting work
      parameters:
        - {
            name: taskId,
            in: path,
            required: true,
            schema: { type: integer, minimum: 1 },
          }
      responses:
        "200":
          description: Observed metadata eligibility; the write revalidates under locks
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/CodexSessionRecoveryStatus" }
        "404": { description: Task missing }
        "503": { description: Recovery metadata unavailable }
  /tasks/{taskId}/coding-session/recover:
    post:
      operationId: recoverCodexSession
      tags: [tasks]
      summary: Archive a stopped coding session and permit a fresh session on a later authorized task invocation
      description: Operator-only metadata transition. Requires a unique request identity, exact observed revision and explicit acknowledgement that uncertain effects remain unresolved. Does not start or resume a task, reconcile effects, delete files, reuse a private home or grant native permissions. Running sessions, unknown cleanup, active task ownership and live native approvals are refused. Repeating a committed request returns its original receipt; changed scope conflicts.
      parameters:
        - {
            name: taskId,
            in: path,
            required: true,
            schema: { type: integer, minimum: 1 },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CodexSessionRecoveryInput" }
      responses:
        "200":
          description: Immutable accepted or rejected recovery receipt
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/CodexSessionRecoveryReceipt" }
        "400":
          { description: Invalid request or missing explicit acknowledgement }
        "409": { description: Request identity belongs to another scope }
        "503":
          {
            description: Commit or receipt is uncertain; query the same request identity,
          }
  /tasks/{taskId}/coding-session/recover/{requestId}:
    get:
      operationId: getCodexSessionRecoveryReceipt
      tags: [tasks]
      summary: Recover the immutable receipt after a lost response
      parameters:
        - {
            name: taskId,
            in: path,
            required: true,
            schema: { type: integer, minimum: 1 },
          }
        - {
            name: requestId,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses:
        "200":
          description: Original committed receipt, independent of subsequent task or session state
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/CodexSessionRecoveryReceipt" }
        "404": { description: No receipt committed for this scope }
        "503": { description: Receipt unavailable }
  /connections/codex:
    get:
      operationId: getCodexTaskStatus
      tags: [settings]
      summary: Read the executing workers' optional coding configuration without probes or inference
      description: Authenticated read-only observation of fresh healthy scheduler workers. Startup flags are not native availability or filesystem containment proof. Every task still requires live authority and actual native preflight. API-host flags and operating system never substitute for worker reports.
      responses:
        "200":
          description: Bounded worker configuration snapshot; never claims globally verified coding
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodexTaskStatus"
        "503":
          description: Status unavailable; no credential or raw backend diagnostic is returned
  /connections/chatgpt:
    get:
      operationId: getChatGPTConnection
      tags: [settings]
      summary: Saved ChatGPT accounts and explicit active selection, without credentials
      responses:
        "200":
          description: Public account state; no inference or token renewal is performed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatGPTConnection"
        "503":
          description: Protected registration storage unavailable
  /connections/chatgpt/sign-in:
    post:
      operationId: beginChatGPTSignIn
      tags: [settings]
      summary: Start a private loopback sign-in on the browser's computer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [callbackLocation]
              properties:
                callbackLocation: { type: string, enum: [same-computer] }
                registrationId: { type: string, format: uuid }
                retryAttemptId: { type: string, format: uuid }
                requestPlanPermission:
                  type: boolean
                  description: Explicitly request fresh plan consent for a selected saved account or retry; ordinary sign-in never forces consent
      responses:
        "201":
          description: One-time authorization URL. Open directly; never log, persist or send to analytics.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatGPTSignInStart"
        "400":
          description: Invalid request or mutually exclusive registration and retry
        "404":
          description: Saved registration or attempt missing
        "409":
          description: Retry no longer available
        "422":
          description: Remote browsers need protected CLI handoff
        "429":
          description: Too many pending attempts
        "503":
          description: Connection unavailable
  /connections/chatgpt/sign-in/{attemptId}:
    parameters:
      - {
          name: attemptId,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
    get:
      operationId: getChatGPTSignIn
      tags: [settings]
      responses:
        "200":
          description: Public attempt state, including uncommitted account review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatGPTSignInStatus"
        "400": { description: Invalid attempt ID }
        "404": { description: Attempt missing }
        "503": { description: Connection unavailable }
    delete:
      operationId: cancelChatGPTSignIn
      tags: [settings]
      responses:
        "204": { description: Cancelled and private callback listener closed }
        "400": { description: Invalid attempt ID }
        "404": { description: Attempt missing }
        "409":
          { description: Explicitly confirmed account is already being saved }
        "503": { description: Connection unavailable }
  /connections/chatgpt/sign-in/{attemptId}/confirm:
    parameters:
      - {
          name: attemptId,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
    post:
      operationId: confirmChatGPTAccount
      tags: [settings]
      summary: Save the validated candidate and explicitly select it; never starts a job
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatGPTExpectedRevision" }
      responses:
        "200":
          description: Confirmed account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatGPTAccount" }
        "400": { description: Invalid request }
        "404": { description: Attempt missing }
        "409": { description: Review required or registration changed }
        "503": { description: Connection unavailable }
  /connections/chatgpt/accounts/{registrationId}/select:
    parameters:
      - {
          name: registrationId,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
    post:
      operationId: selectChatGPTAccount
      tags: [settings]
      summary: Select an existing signed-in account at its observed revision
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatGPTExpectedRevision" }
      responses:
        "200":
          description: Selected account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatGPTAccount" }
        "400": { description: Invalid request }
        "404": { description: Registration missing }
        "409": { description: Registration changed or signed out }
        "503": { description: Connection unavailable }
  /connections/chatgpt/accounts/{registrationId}/plan/retry:
    parameters:
      - {
          name: registrationId,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
    post:
      operationId: retryChatGPTPlan
      tags: [settings]
      summary: Explicitly clear this observed quota pause; never starts a job or changes provider
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedRevision, pauseId]
              properties:
                expectedRevision:
                  { type: integer, minimum: 0, maximum: 9007199254740991 }
                pauseId: { type: string, format: uuid }
      responses:
        "200":
          description: Account with admission resumed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatGPTAccount" }
        "400": { description: Invalid request }
        "404": { description: Registration missing }
        "409":
          {
            description: "Registration or pause changed, signed out or plan permission missing",
          }
        "503": { description: Connection unavailable }
  /connections/chatgpt/accounts/{registrationId}/session:
    parameters:
      - {
          name: registrationId,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
    delete:
      operationId: signOutChatGPTAccount
      tags: [settings]
      summary: Stop renewable session, clear credentials and retain account mapping
      responses:
        "200":
          description: Local sign-out with a separate remote revocation result
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [localSignedOut, revocationConfirmed]
                properties:
                  localSignedOut: { type: boolean, enum: [true] }
                  revocationConfirmed: { type: [boolean, "null"] }
        "400": { description: Invalid registration ID }
        "409": { description: Session unavailable }
        "503": { description: Connection unavailable }
  /source-changes:
    get:
      operationId: listSourceChanges
      tags: [source]
      responses:
        "200":
          description: Source change history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SourceChange"
    post:
      operationId: prepareSourceChange
      tags: [source]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [id, agentId, sourcePath, request]
              properties:
                id: { type: string, format: uuid }
                agentId: { type: integer, minimum: 1 }
                sourcePath: { type: string, minLength: 1, maxLength: 2048 }
                request: { type: string, minLength: 1, maxLength: 4000 }
      responses:
        "200":
          description: Isolated source workspace and agent project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceChange"
  /source-changes/{id}:
    get:
      operationId: inspectSourceChange
      tags: [source]
      parameters:
        - {
            name: id,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses:
        "200":
          description: Source change and redacted diff
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceChange"
  /source-changes/{id}/check:
    post:
      operationId: checkSourceChange
      tags: [source]
      parameters:
        - {
            name: id,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedRevision, command]
              properties:
                expectedRevision: { type: integer, minimum: 1 }
                command:
                  oneOf:
                    - type: array
                      minItems: 1
                      maxItems: 64
                      items: { type: string }
                    - type: array
                      minItems: 1
                      maxItems: 4
                      items:
                        type: array
                        minItems: 1
                        maxItems: 64
                        items: { type: string }
      responses:
        "200":
          description: Recorded result; an unknown outcome must not be replayed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceChange"
        "409":
          description: State, revision, repository or permission conflict
  /source-changes/{id}/apply:
    post:
      operationId: applySourceChange
      tags: [source]
      parameters:
        - {
            name: id,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedRevision]
              properties:
                expectedRevision: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Recorded result; an unknown outcome must not be replayed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceChange"
        "409":
          description: State, revision, repository or permission conflict
  /source-changes/{id}/rollback:
    post:
      operationId: rollbackSourceChange
      tags: [source]
      parameters:
        - {
            name: id,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedRevision]
              properties:
                expectedRevision: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Recorded result; an unknown outcome must not be replayed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceChange"
        "409":
          description: State, revision, repository or permission conflict
  /skills/extensions:
    get:
      operationId: listPersonalCapabilities
      tags: [skills]
      summary: List persistent personal skills and utility presets
      responses:
        "200":
          description: Operator-owned installations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PersonalCapability"
    put:
      operationId: savePersonalCapability
      tags: [skills]
      summary: Atomically create or update a personal capability
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [manifest, enabled, expectedRevision]
              properties:
                manifest:
                  $ref: "#/components/schemas/PersonalCapabilityManifest"
                enabled:
                  type: boolean
                expectedRevision:
                  type: integer
                  minimum: 0
      responses:
        "200":
          description: Saved capability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalCapability"
        "400":
          description: Invalid manifest
        "409":
          description: Reload the current revision before editing again
  /skills/extensions/{id}/export:
    get:
      operationId: exportPersonalCapability
      tags: [skills]
      summary: Export the manifest without installation state
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            pattern: ^user-[a-z0-9][a-z0-9-]*$
      responses:
        "200":
          description: Capability manifest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalCapabilityManifest"
        "404":
          description: Capability not found
  /skills/packs:
    get:
      operationId: getCapabilityPacks
      tags: [skills]
      summary: Read enabled capability packs
      responses:
        "200":
          description: Current selection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapabilityPackSelection"
    put:
      operationId: updateCapabilityPacks
      tags: [skills]
      summary: Persist the selected packs with a revision check
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [enabledPacks, expectedRevision]
              properties:
                enabledPacks:
                  type: array
                  maxItems: 5
                  uniqueItems: true
                  items:
                    $ref: "#/components/schemas/CapabilityPackId"
                expectedRevision:
                  type: integer
                  minimum: 1
      responses:
        "200":
          description: Saved selection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapabilityPackSelection"
        "400":
          description: Invalid selection
        "409":
          description: Revision conflict
  /skills:
    get:
      operationId: getCapabilityCatalog
      tags: [skills]
      summary: Read the built-in skills and local utility catalog
      parameters:
        - name: locale
          in: query
          schema:
            type: string
            enum: [tr, en, de, ru, zh-CN, zh-TW, ar]
            default: tr
      responses:
        "200":
          description: Versioned localized catalog; reading it does not start work or grant access
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapabilityCatalog"
        "400":
          description: Invalid or repeated locale parameter
        "401":
          description: Operator authentication required
  /healthz:
    get:
      security: []
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /readyz:
    get:
      security: []
      operationId: readinessCheck
      tags: [health]
      summary: Readiness check
      description: Returns 200 only after startup and database migrations complete, and 503 while draining.
      responses:
        "200":
          description: Ready to serve traffic
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessStatus"
        "503":
          description: Starting, database unavailable, or shutting down
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessStatus"

  /auth/status:
    get:
      security: []
      operationId: operatorAuthStatus
      tags: [auth]
      summary: Inspect operator authentication state
      responses:
        "200":
          description: Authentication state for this request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorAuthStatus"

  /auth/login:
    post:
      security: []
      operationId: operatorLogin
      tags: [auth]
      summary: Exchange the configured operator token for a signed session cookie
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OperatorLoginInput"
      responses:
        "200":
          description: Authenticated; sets an HttpOnly SameSite=Strict session cookie
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorAuthStatus"
        "401":
          description: Invalid operator token
        "429":
          description: Login rate limit exceeded

  /auth/session:
    delete:
      security: []
      operationId: operatorLogout
      tags: [auth]
      summary: Clear the browser operator session
      responses:
        "204":
          description: Session cookie cleared

  /agent-templates:
    get:
      operationId: listAgentTemplates
      tags: [agents]
      summary: List preset agent/department templates
      parameters:
        - name: locale
          in: query
          schema:
            type: string
            enum: [tr, en, de, ru, zh-CN, zh-TW, ar]
            default: tr
      responses:
        "200":
          description: Available templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgentTemplate"

  /workforce-blueprints:
    get:
      operationId: listWorkforceBlueprints
      tags: [workforces]
      summary: List authored, versioned multi-agent workforce blueprints
      parameters:
        - name: locale
          in: query
          schema:
            type: string
            enum: [tr, en, de, ru, zh-CN, zh-TW, ar]
            default: tr
      responses:
        "200":
          description: Available workforce blueprints
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkforceBlueprint"

  /workforce-blueprints/{blueprintKey}/install:
    parameters:
      - name: blueprintKey
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 100
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
    post:
      operationId: installWorkforceBlueprint
      tags: [workforces]
      summary: Atomically install a workforce under an active manager and optionally start its first outcome
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkforceBlueprintInstallInput"
      responses:
        "201":
          description: Installed workforce and optional kickoff task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkforceInstallation"
        "400":
          description: Invalid blueprint key or install input
        "403":
          description: Selected manager cannot create sub-agents
        "409":
          description: Selected manager is inactive, preview version changed, or request ID conflicts with a different payload
        "404":
          description: Blueprint or selected manager was not found
        "423":
          description: Emergency stop is active
        "429":
          description: Runtime agent or task capacity reached

  /agents:
    get:
      operationId: listAgents
      tags: [agents]
      summary: List agents in the org chart
      parameters:
        - name: parentAgentId
          in: query
          schema:
            type: number
        - name: department
          in: query
          schema:
            type: string
        - name: includeInactive
          in: query
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Agents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Agent"
    post:
      operationId: createAgent
      tags: [agents]
      summary: Create a new agent (by a user or by a delegating agent)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentInput"
      responses:
        "201":
          description: Created agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"

  /agents/{agentId}:
    parameters:
      - name: agentId
        in: path
        required: true
        schema:
          type: number
    get:
      operationId: getAgent
      tags: [agents]
      summary: Get an agent
      responses:
        "200":
          description: Agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        "404":
          description: Not found
    patch:
      operationId: updateAgent
      tags: [agents]
      summary: Update an agent's persona, model, or permissions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentUpdate"
      responses:
        "409":
          description: Reviewed configuration changed, or a conflicting operation is in flight.
        "200":
          description: Updated agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"

  /agents/{agentId}/avatar:
    parameters:
      - name: agentId
        in: path
        required: true
        schema:
          type: number
    get:
      operationId: getAgentAvatar
      tags: [agents]
      summary: Read an agent's custom avatar image
      parameters:
        - name: v
          in: query
          description: Cache-busting avatar version from the Agent resource
          schema:
            type: string
      responses:
        "200":
          description: Avatar image
          headers:
            ETag:
              schema:
                type: string
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        "304":
          description: Cached image is current
        "404":
          description: Agent or custom avatar not found
    put:
      operationId: updateAgentAvatar
      tags: [agents]
      summary: Replace an agent's custom avatar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentAvatarInput"
      responses:
        "409":
          description: Reviewed configuration changed, or a conflicting operation is in flight.
        "200":
          description: Agent with a new avatar version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
    delete:
      operationId: resetAgentAvatar
      tags: [agents]
      summary: Restore an agent's built-in avatar
      parameters:
        - name: expectedConfig
          in: query
          schema:
            type: string
            pattern: "^[a-f0-9]{64}$"
          description: Exact configVersion reviewed by the caller; conflicts return 409.
      responses:
        "409":
          description: Reviewed configuration changed, or a conflicting operation is in flight.
        "200":
          description: Agent using the built-in avatar
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"

  /agents/{agentId}/messages:
    parameters:
      - name: agentId
        in: path
        required: true
        schema:
          type: number
    get:
      operationId: listAgentMessages
      tags: [agents]
      summary: List a scoped chat thread with an agent
      description: >
        Omitting taskId returns only the direct agent conversation
        (messages whose taskId is null). Supplying taskId returns only the
        conversation bound to that project task.
      parameters:
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/BeforeId"
        - name: taskId
          in: query
          required: false
          description: Positive project task id used to isolate the conversation.
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"
    post:
      operationId: sendAgentMessage
      tags: [agents]
      summary: Send a chat message directly to any agent in the org
      description: >
        Any agent -- not only the CEO -- can be messaged directly. The agent
        replies immediately and may, as part of handling the message, create
        tasks or sub-agents (returned in the response for immediate UI update).
        When taskId is supplied, the task must exist and be owned by the
        addressed active agent; the complete turn is isolated to that project
        conversation and executes with that task context.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageInput"
      responses:
        "200":
          description: Agent reply
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentMessageResponse"

  /agents/{agentId}/requests:
    parameters:
      - name: agentId
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    post:
      operationId: sendAgentRequest
      tags: [agents]
      summary: Send one durable chat or project creation intent
      description: >
        A required requestId is bound permanently to the exact intent. Replaying
        it returns its receipt without starting work again, including during an
        emergency stop. Project creation and its receipt commit together. An
        unconfirmed chat receipt may still be running or may have been interrupted;
        it is never automatically restarted. Complete describes the request,
        not successful completion of all tools or of the queued project.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentRequestInput"
      responses:
        "200":
          description: Durable receipt, including explicit rejection or unconfirmed execution
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRequestReceipt"

  /agents/{agentId}/requests/{requestId}:
    get:
      operationId: getAgentRequest
      tags: [agents]
      summary: Read a send receipt without dispatching work
      parameters:
        - name: agentId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
        - name: requestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Stored receipt; available even when the agent is archived
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRequestReceipt"

  /company-chat:
