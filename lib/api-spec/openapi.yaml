        "404":
          description: Project not found
        "409":
          description: Identity conflict, root-project requirement, or incompatible meeting state

  /projects/{projectId}/meetings/{meetingId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/MeetingId"
    get:
      operationId: getProjectMeeting
      tags: [project-meetings]
      summary: Get one meeting only within its owning project
      responses:
        "200":
          description: Full durable meeting record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMeetingDetail"
