      summary: Inspect a budget resume receipt without dispatching work
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
        - name: requestId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Immutable stored receipt, including after task deletion
