    post:
      operationId: createProjectMeeting
      tags: [project-meetings]
      summary: Create a durable meeting inside one root project
      description: Participant storage is normalized and has no product-level roster ceiling. Requires a saved UUID requestId. Identical retries return the original compact result; changed input under an accepted identity returns 409. Inspect the project-scoped command receipt after an uncertain response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectMeetingInput"
      responses:
        "201":
          description: Compact immutable command result; read current records with GET
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMeetingCommandResult"
        "400":
