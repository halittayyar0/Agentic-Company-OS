  /projects/{projectId}/meetings:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listProjectMeetings
      tags: [project-meetings]
      summary: List meetings owned by one root project
      description: A meeting from any other project is never included.
      parameters:
        - $ref: "#/components/parameters/PageLimit"
