      description: Versioned personal skill, bounded utility preset or operator-installed Node program. Maximum serialized size is 16000 characters. Programs declare terminal authority and execute through the exact approval-bound terminal path. No credential or arbitrary executable fields are accepted.
      oneOf:
        - type: object
          additionalProperties: false
          required: [schemaVersion, id, kind, title, description, instructions]
          properties:
            schemaVersion:
              type: integer
              enum: [1]
            id:
              type: string
              pattern: ^user-[a-z0-9][a-z0-9-]{0,59}$
            kind:
              type: string
              enum: [skill]
            title:
              type: string
              minLength: 1
              maxLength: 120
            description:
              type: string
              minLength: 1
              maxLength: 2000
            instructions:
              type: string
              minLength: 1
              maxLength: 8000
        - type: object
          additionalProperties: false
          required:
            [schemaVersion, id, kind, title, description, tool, defaults]
          properties:
            schemaVersion:
              type: integer
              enum: [1]
            id:
              type: string
              pattern: ^user-[a-z0-9][a-z0-9-]{0,59}$
            kind:
              type: string
              enum: [tool]
            title:
              type: string
              minLength: 1
              maxLength: 120
            description:
              type: string
              minLength: 1
              maxLength: 2000
            tool:
              type: string
              description: Exact built-in utility name from the capability catalog
            defaults:
              type: object
              additionalProperties: {}
        - type: object
          additionalProperties: false
          required:
            [schemaVersion, id, kind, title, description, code, permissions]
          properties:
            schemaVersion: { type: integer, enum: [1] }
            id: { type: string, pattern: "^user-[a-z0-9][a-z0-9-]{0,59}$" }
            kind: { type: string, enum: [program] }
            title: { type: string, minLength: 1, maxLength: 120 }
            description: { type: string, minLength: 1, maxLength: 2000 }
            code: { type: string, minLength: 1, maxLength: 8000 }
            permissions:
              type: array
              minItems: 1
              maxItems: 1
              items: { type: string, enum: [terminal] }
