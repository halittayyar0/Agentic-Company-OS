        "409":
          description: The project id belongs to a child task
    patch:
      operationId: updateProjectMeeting
      tags: [project-meetings]
      summary: Edit meeting metadata, roster, scheduling, or cancel it
      description: Starting and completing use command endpoints so transcript and synthesis invariants cannot be bypassed. Requires a saved UUID requestId. Identical retries return the original compact result; changed input under an accepted identity returns 409. Inspect the project-scoped command receipt after an uncertain response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectMeetingUpdate"
      responses:
        "200":
          description: Compact immutable command result; read current records with GET
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMeetingCommandResult"
        "400":
          description: Invalid edit or status transition
        "404":
          description: Meeting does not exist in this project
        "409":
          description: Identity conflict, root-project requirement, or incompatible meeting state

  /projects/{projectId}/meetings/{meetingId}/turn-requests/{requestId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/MeetingId"
      - name: requestId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getProjectMeetingTurnReceipt
      tags: [project-meetings]
      summary: Observe an accepted meeting turn without dispatching work
      responses:
        "200":
          description: Durable receipt; expired unfinished work is unconfirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMeetingTurnReceipt"
        "400":
          description: Invalid identity
        "404":
          description: No request with this identity and scope is recorded

  /projects/{projectId}/meetings/{meetingId}/start:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/MeetingId"
    post:
      operationId: startProjectMeeting
      tags: [project-meetings]
      summary: Run one bounded, tool-free project meeting round
      description: >
        Persists the founder turn before provider work, then runs a bounded
        subset of the selected unlimited roster sequentially. Every agent sees
        the project title and brief, meeting agenda, and preceding project-only
        transcript. Agent leases, response tokens, database-wide concurrency, and
        per-start responder attempts are bounded. A provider outage leaves the
        draft, agenda, and founder transcript intact. A requestId is mandatory.
        Replaying an accepted identity only observes its stored outcome, including
        after restart or deletion; it never invokes the model again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectMeetingStartInput"
      responses:
        "200":
          description: Meeting detail plus bounded execution outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMeetingStartResponse"
        "202":
          description: The same accepted request is still running; query its receipt.
        "400":
          description: Invalid participant selection or token limit
        "404":
          description: Meeting does not exist in this project
        "409":
          description: Meeting is closed, already running, or no participant acquired a turn
        "423":
          description: Emergency stop is active
        "429":
          description: Shared meeting execution capacity is full
        "503":
          description: No configured model provider could run the round; persisted input is returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMeetingStartFailure"

  /projects/{projectId}/meetings/{meetingId}/complete:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/MeetingId"
    post:
      operationId: completeProjectMeeting
      tags: [project-meetings]
      summary: Atomically complete a meeting with its synthesis
      description: Decisions become durable meeting records; action items are created open and never presented as completed external work. Requires a saved UUID requestId. Identical retries return the original compact result; changed input under an accepted identity returns 409. Inspect the project-scoped command receipt after an uncertain response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectMeetingCompleteInput"
      responses:
        "200":
          description: Compact immutable command result; read current records with GET
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMeetingCommandResult"
        "400":
          description: Invalid synthesis or non-participant owner
        "404":
          description: Meeting does not exist in this project
        "409":
          description: Identity conflict, root-project requirement, or incompatible meeting state

  /projects/{projectId}/meetings/{meetingId}/transcript:
