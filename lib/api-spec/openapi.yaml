      summary: Append a founder note to the durable meeting transcript
      description: Agent speech cannot be authored through this endpoint; only the leased start executor writes agent transcript rows. Requires a saved UUID requestId. Identical retries return the original compact result; changed input under an accepted identity returns 409. Inspect the project-scoped command receipt after an uncertain response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectMeetingTranscriptInput"
      responses:
        "201":
          description: Compact immutable command result; read current records with GET
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMeetingCommandResult"
        "400":
          description: Invalid note or reply target
        "404":
          description: Meeting does not exist in this project

        "409":
          description: Identity conflict or the project id belongs to a child task

  /projects/{projectId}/meetings/{meetingId}/decisions:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/MeetingId"
    post:
      operationId: createProjectMeetingDecision
      tags: [project-meetings]
      summary: Persist one project meeting decision
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectMeetingDecisionInput"
      responses:
        "201":
          description: Compact immutable command result; read current records with GET Requires a saved UUID requestId. Identical retries return the original compact result; changed input under an accepted identity returns 409. Inspect the project-scoped command receipt after an uncertain response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMeetingCommandResult"
        "400":
          description: Invalid decision or non-participant owner
        "404":
          description: Meeting does not exist in this project

        "409":
          description: Identity conflict or the project id belongs to a child task

  /projects/{projectId}/meetings/{meetingId}/action-items:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/MeetingId"
    post:
      operationId: createProjectMeetingActionItem
      tags: [project-meetings]
      summary: Persist one open project meeting action item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectMeetingActionItemInput"
      responses:
        "201":
          description: Compact immutable command result; read current records with GET Requires a saved UUID requestId. Identical retries return the original compact result; changed input under an accepted identity returns 409. Inspect the project-scoped command receipt after an uncertain response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMeetingCommandResult"
        "400":
          description: Invalid action item or non-participant owner
        "404":
          description: Meeting does not exist in this project

        "409":
          description: Identity conflict or the project id belongs to a child task

  /projects/{projectId}/meetings/{meetingId}/action-items/{actionItemId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/MeetingId"
      - name: actionItemId
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    patch:
      operationId: updateProjectMeetingActionItem
      tags: [project-meetings]
      summary: Edit or resolve one meeting action item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectMeetingActionItemUpdate"
      responses:
        "200":
          description: Compact immutable command result; read current records with GET Requires a saved UUID requestId. Identical retries return the original compact result; changed input under an accepted identity returns 409. Inspect the project-scoped command receipt after an uncertain response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMeetingCommandResult"
        "400":
          description: Invalid update or non-participant owner
        "404":
          description: Meeting or action item does not exist in this project

        "409":
          description: Identity conflict or the project id belongs to a child task

  /activity:
    get:
      operationId: listActivity
      tags: [activity]
      summary: Global activity / audit feed across the whole org
      parameters:
        - name: agentId
          in: query
          schema:
            type: number
        - name: taskId
          in: query
          schema:
            type: number
        - name: severity
          in: query
          schema:
            $ref: "#/components/schemas/ActivityEventSeverity"
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/BeforeId"
      responses:
        "200":
          description: Activity events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityEvent"

  /approvals:
    get:
      operationId: listApprovals
      tags: [approvals]
      summary: List approval requests
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/ApprovalStatus"
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/BeforeId"
      responses:
        "200":
          description: Approval requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApprovalRequest"

  /approvals/{approvalId}/decision:
    parameters:
      - name: approvalId
        in: path
        required: true
        schema:
          type: number
    post:
      operationId: resolveApproval
      tags: [approvals]
      summary: Approve or reject a pending approval request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalDecisionInput"
      responses:
        "200":
          description: Resolved approval request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalRequest"

  /org/summary:
    get:
      operationId: getOrgSummary
      tags: [org]
      summary: Org-wide dashboard summary
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgSummary"

  /model-catalog:
    get:
      operationId: getModelCatalog
      tags: [models]
      summary: All selectable models grouped by configured server-side provider
      responses:
        "200":
          description: Model catalog with provider availability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelCatalog"

  /settings/llm:
    get:
      operationId: getLlmSettings
      tags: [settings]
      summary: Read redacted LLM provider settings and the live model catalog
      responses:
        "200":
          description: Redacted provider configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LlmSettings"
    put:
      operationId: updateLlmSettings
      tags: [settings]
      summary: Replace or clear locally persisted OpenRouter and direct OpenAI credentials
      description: >
        Use expectedRevision to reject stale writes. Clearing a saved key falls back
        to any server environment key. Saving does not verify provider access or
        prove that every worker has applied the revision. An uncertain response
        requires a fresh read and operator review before another save.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLlmSettingsInput"
      responses:
        "200":
          description: Provider configuration updated and catalog refreshed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateLlmSettingsResult"
        "400":
          description: Invalid provider settings
        "409":
          description: The reviewed provider settings revision changed
        "429":
          description: Too many configuration writes
        "503":
          description: The save outcome is unknown and may already be committed

  /settings/execution-policy:
    get:
      operationId: getExecutionPolicy
      tags: [settings]
      summary: Read persisted operator execution permissions
      responses:
        "200":
          description: Current policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionPolicy"
    put:
      operationId: updateExecutionPolicy
      tags: [settings]
      summary: Change execution permissions with revision checking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateExecutionPolicyBody"
      responses:
        "200":
          description: Policy saved and audited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionPolicy"
        "400":
          description: Invalid mode or custom permissions
        "409":
          description: Policy changed; reload before saving

  /settings/locale:
    get:
      operationId: getWorkspaceLocale
      tags: [settings]
      summary: Read the persisted workspace language used for agent replies
      responses:
        "200":
          description: Current workspace language
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceLocaleSetting"
    put:
      operationId: updateWorkspaceLocale
      tags: [settings]
      summary: Save the language for the interface and future agent turns
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceLocaleSetting"
      responses:
        "200":
          description: Workspace language saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceLocaleSetting"
        "400":
          description: Unsupported workspace language

  /settings/llm/test:
    post:
      operationId: testLlmConnection
      tags: [settings]
      summary: Run a bounded, ten-token provider connectivity test
      description: >
        Explicitly selected model only. May incur provider charges. The test
        uses a twenty-second deadline with SDK retries disabled, checks emergency
        stop before dispatch and reports changed configuration as stale.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestLlmInput"
      responses:
        "200":
          description: Provider connection succeeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LlmTestSuccess"
        "400":
          description: Invalid request or the selected provider is not configured
        "409":
          description: The reviewed settings changed before or during the test
        "423":
          description: Emergency stop is active
        "429":
          description: Too many provider tests
        "502":
          description: Provider connection failed without exposing upstream details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LlmTestFailure"

  /ops/stream:
    get:
      operationId: streamOperations
      tags: [operations]
      summary: Stream durable Operations snapshot invalidations
      description: >
        Authenticated same-origin EventSource stream. Snapshot and
        operations_changed events carry durable decimal ids; heartbeat events
        are deliberately id-less. Connections are periodically recycled so
        authentication is re-evaluated.
      parameters:
        - $ref: "#/components/parameters/OperationsWindowHours"
        - name: taskId
          in: query
          description: Optional positive root-project id; omit for fleet overview.
          schema:
            type: integer
            minimum: 1
        - name: cursor
          in: query
          description: Optional initial durable cursor. Last-Event-ID takes precedence on reconnect.
          schema:
            type: string
            pattern: "^(0|[1-9][0-9]*)$"
            maxLength: 10
      responses:
        "200":
          description: Server-sent snapshot, operations_changed, and heartbeat frames
          headers:
            X-Accel-Buffering:
              schema:
                type: string
                enum: ["no"]
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          description: Invalid project, cursor, or operations window
        "404":
          description: Project task was not found
        "409":
          description: The requested task is not a root project, or Last-Event-ID is ahead of durable state
        "503":
          description: Process-local stream connection capacity was reached

  /ops/overview:
    get:
      operationId: getOperationsOverview
      tags: [operations]
      summary: Read the bounded fleet-wide Operations snapshot
      parameters:
        - $ref: "#/components/parameters/OperationsWindowHours"
      responses:
        "200":
          description: Current runtime, queue, usage, and fleet health history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationsOverview"
        "400":
          description: Invalid operations window

  /ops/instances:
    get:
      operationId: listRuntimeInstances
      tags: [operations]
      summary: List public runtime instance health without host or lease identifiers
      parameters:
        - $ref: "#/components/parameters/OperationsWindowHours"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 200
      responses:
        "200":
          description: Bounded runtime instance health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationsRuntimeInstanceList"
        "400":
          description: Invalid operations window or limit

  /tasks/{taskId}/operations:
    parameters:
      - name: taskId
        in: path
        required: true
        description: Positive id of a root project task.
        schema:
          type: integer
          minimum: 1
    get:
      operationId: getProjectOperations
      tags: [operations]
      summary: Read a bounded root-project Operations snapshot
      description: Fleet health samples are global and are not attributed to this project.
      parameters:
        - $ref: "#/components/parameters/OperationsWindowHours"
      responses:
        "200":
          description: Project members, attempts, safe receipts, typed timeline, and fleet health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectOperationsSnapshot"
        "400":
          description: Invalid project id or operations window
        "404":
          description: Project task was not found
        "409":
          description: The requested task is not a root project

  /tasks/{taskId}/operations/receipts/{receiptId}:
    get:
      operationId: getProjectOperationReceipt
      tags: [operations]
      summary: Read one safe receipt and its immutable reconciliation audit within a root project
      description: Independent of history windows and list caps. Read-only; never executes an operation or records a decision. A missing record does not prove that an external effect did not occur. The response must not be cached.
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
        - name: receiptId
          in: path
          required: true
          description: Receipt identifier, at most 256 UTF-8 bytes.
          schema:
            type: string
            minLength: 1
            maxLength: 256
      responses:
        "200":
          description: Safe receipt projection and original immutable audit, if recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationsReceiptReview"
        "400":
          description: Invalid identity or unsupported query
        "404":
          description: Project or receipt is missing from this project scope
        "409":
          description: The requested task is not a root project

  /ops/control:
    get:
      operationId: getOpsControl
      tags: [operations]
      summary: Read the persisted fleet-wide emergency-stop state
      responses:
        "200":
          description: Current runtime control state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmergencyStopStatus"
    put:
      operationId: updateOpsControl
      tags: [operations]
      summary: Enable or disable the persisted fleet-wide emergency stop
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOpsControlInput"
      responses:
        "200":
          description: Persisted transition and local cleanup result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmergencyStopTransition"
        "400":
          description: Invalid transition or missing activation reason

  /ops/receipts/{receiptId}/reconcile:
    parameters:
      - name: receiptId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 256
    post:
      operationId: reconcileOperationReceipt
      tags: [operations]
      summary: Record an immutable operator decision for an unknown operation outcome
      description: The durable audit actor is supplied only by server-side OPERATOR_AUDIT_ID configuration.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReconcileOperationInput"
      responses:
        "200":
          description: Reconciliation was recorded, or the same immutable decision was already recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationReconciliation"
        "400":
          description: Invalid receipt identifier, decision, or audit note
        "404":
          description: Operation receipt was not found
        "409":
          description: Receipt is not unknown, evidence is inconsistent, or a different decision already won

  /agents/{agentId}/vm/status:
    parameters:
      - name: agentId
        in: path
        required: true
        schema:
          type: number
    get:
      operationId: getVmStatus
      tags: [vm]
      summary: Sandbox usage stats for an agent's virtual computer
      responses:
        "200":
          description: VM status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VmStatus"

  /agents/{agentId}/vm/files-list:
    parameters:
      - name: agentId
        in: path
        required: true
        schema:
          type: number
    post:
      operationId: listVmFiles
      tags: [vm]
      summary: List a directory inside the agent's sandbox
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VmPathInput"
      responses:
        "200":
          description: Directory listing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VmListing"

  /agents/{agentId}/vm/file-read:
    parameters:
      - name: agentId
        in: path
        required: true
        schema:
          type: number
    post:
      operationId: readVmFile
      tags: [vm]
      summary: Read a text file from the sandbox
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VmPathInput"
      responses:
        "200":
          description: File content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VmFileContent"

  /agents/{agentId}/vm/file-write:
    parameters:
      - name: agentId
        in: path
        required: true
        schema:
          type: number
    put:
      operationId: writeVmFile
      tags: [vm]
      summary: Create a missing file or replace a reviewed UTF-8 file without losing a newer revision
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VmWriteInput"
      responses:
        "200":
          description: Written file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VmWriteResult"

  /agents/{agentId}/vm/file-delete-preview:
    parameters:
      - name: agentId
        in: path
        required: true
        schema:
          type: number
    post:
      operationId: previewVmDeletion
      tags: [vm]
      summary: Inspect the complete bounded deletion scope without deleting
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VmDeletePreviewInput"
      responses:
        "200":
          description: Complete scope including the target; rejects symlinks and scopes over 1000 entries, 64 MiB, depth 32, or 5 seconds of inspection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VmDeletionPreview"

  /agents/{agentId}/vm/file-delete:
    parameters:
      - name: agentId
        in: path
        required: true
        schema:
          type: number
    delete:
      operationId: deleteVmFile
      tags: [vm]
      summary: Delete a file or directory only if its complete reviewed scope is unchanged
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VmDeleteInput"
      responses:
        "200":
          description: Deletion result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VmDeleteResult"

  /agents/{agentId}/operator-requests/{requestId}:
    get:
      operationId: getOperatorRequest
      tags: [vm]
      summary: Inspect one accepted operator request without replaying it, even after agent deletion
      parameters:
        - name: agentId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
        - name: requestId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/OperatorRequestId"
      responses:
        "200":
          description: Exact receipt; encrypted Terminal output is included only when recoverable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorRequestReceipt"
        "400":
          description: Noncanonical scope or unsupported query parameters
        "404":
          description: No accepted request in this exact scope

  /agents/{agentId}/vm/exec:
    parameters:
      - name: agentId
        in: path
        required: true
        schema:
          type: number
    post:
      operationId: execVmCommand
      tags: [vm]
      summary: Run a command inside the agent's sandboxed shell (or host shell with founder authority)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VmExecInput"
      responses:
        "200":
          description: Durable receipt and optional recorded command result; replay never dispatches again
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorTerminalResponse"

  /agents/{agentId}/browser/view:
    parameters:
      - name: agentId
        in: path
        required: true
        schema:
          type: number
    get:
      operationId: getBrowserView
      tags: [vm]
      summary: Live PNG screenshot of the agent's real browser session
      responses:
        "200":
          description: Current page screenshot and metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowserView"
        "503":
          description: The owning browser worker is unavailable or the command outcome is unknown

  /agents/{agentId}/browser/control:
    parameters:
      - name: agentId
        in: path
        required: true
        schema:
          type: number
    get:
      operationId: getBrowserControl
      tags: [vm]
      summary: Read the exact agent/operator ownership state for the browser
      responses:
        "200":
          description: Current browser control owner and lease
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowserControlState"
        "503":
          description: The owning browser worker is unavailable or the command outcome is unknown
    post:
      operationId: updateBrowserControl
      tags: [vm]
      summary: Take over, heartbeat, or release operator browser control
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrowserControlInput"
      responses:
        "200":
          description: Receipt and live control state; heartbeat has a null receipt, replay has a null result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorBrowserControlResponse"
        "409":
          description: Control transition conflicts with the current owner or an in-flight action
        "503":
          description: The owning browser worker is unavailable or the command outcome is unknown

  /agents/{agentId}/browser/navigate:
    parameters:
      - name: agentId
        in: path
        required: true
        schema:
          type: number
    post:
      operationId: navigateBrowser
      tags: [vm]
      summary: Open a URL in the agent's browser (launches the session on demand)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrowserNavigateInput"
      responses:
        "200":
          description: Receipt and optional live view; replay returns no screenshot or browser authority
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorBrowserViewResponse"
        "409":
          description: Browser control or session identity no longer matches
        "503":
          description: The owning browser worker is unavailable or the command outcome is unknown

  /agents/{agentId}/browser/input:
    parameters:
      - name: agentId
        in: path
        required: true
        schema:
          type: number
    post:
      operationId: sendBrowserInput
      tags: [vm]
      summary: Send raw mouse/keyboard input to the agent's browser (operator control)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrowserInputEvent"
      responses:
        "200":
          description: Receipt and optional live input acknowledgement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorBrowserActionResponse"
        "409":
          description: Browser control or session identity no longer matches
        "503":
          description: The owning browser worker is unavailable or the command outcome is unknown

  /agents/{agentId}/browser/close:
    parameters:
      - name: agentId
        in: path
        required: true
        schema:
          type: number
    delete:
      operationId: closeBrowserSession
      tags: [vm]
      summary: Close the agent's browser session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrowserCloseInput"
      responses:
        "200":
          description: Receipt and optional live close acknowledgement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorBrowserActionResponse"
        "409":
          description: Browser control or session identity no longer matches
        "503":
          description: The owning browser worker is unavailable or the command outcome is unknown

components:
  parameters:
    OperationsWindowHours:
      name: windowHours
      in: query
      description: Inclusive UTC observation window in hours.
      schema:
        type: integer
        minimum: 1
        maximum: 168
        default: 24
    PageLimit:
      name: limit
      in: query
      description: Maximum rows to return.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 100
    BeforeId:
      name: beforeId
      in: query
      description: Return rows with an id lower than this cursor.
      schema:
        type: integer
        minimum: 1
    ProjectId:
      name: projectId
      in: path
      required: true
      description: Positive id of a root project task.
      schema:
        type: integer
        minimum: 1
    MeetingId:
      name: meetingId
      in: path
      required: true
      description: Positive meeting id, always resolved together with projectId.
      schema:
        type: integer
        minimum: 1
  securitySchemes:
    operatorBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque operator token
    operatorSession:
      type: apiKey
      in: cookie
      name: agentic_os_session
  schemas:
    InferenceAccountingSnapshot:
      type: object
      additionalProperties: false
      required:
        [
          scopeType,
          scopeId,
          rootTaskId,
          status,
          observedAt,
          unsettledCount,
          hasMore,
          attempts,
        ]
      properties:
        scopeType: { type: string, enum: [task, agent] }
        scopeId: { type: integer, minimum: 1, maximum: 2147483647 }
        rootTaskId: { type: [integer, "null"], minimum: 1 }
        status: { type: string, enum: [clear, pending, recovery_required] }
        observedAt: { type: integer, minimum: 0 }
        unsettledCount: { type: integer, minimum: 0 }
        hasMore: { type: boolean }
        attempts:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/InferenceAccountingAttempt" }
    InferenceAccountingAttempt:
      type: object
      additionalProperties: false
      required:
        [
          id,
          agentId,
          taskId,
          modelId,
          provider,
          kind,
          state,
