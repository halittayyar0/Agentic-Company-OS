            type: number
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/TaskStatus"
        - name: rootOnly
          in: query
          description: Only return tasks with no parent task
          schema:
            type: boolean
            default: false
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/BeforeId"
      responses:
        "200":
          description: Tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
    post:
      operationId: createTask
      tags: [tasks]
      summary: Start a top-level project with the complete active workforce
      description: >
        Every currently active agent is enrolled as a durable project member.
        ownerAgentId is a backwards-compatible coordinator override; when it is
        omitted the server deterministically selects the active root CEO, an
        active structural root, or finally the lowest-id active agent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskInput"
      responses:
        "201":
          description: Created task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "200":
          description: Existing project for the same accepted request identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"

