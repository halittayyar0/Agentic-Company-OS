      type: object
      properties:
        path:
          type: string
        entries:
          type: array
          items:
            $ref: "#/components/schemas/VmEntry"
        total:
          type: number
          description: Number of returned entries, not the complete directory population.
        truncated:
          type: boolean
          description: True when the 2000-entry enumeration limit excluded further entries. Missing on older servers; absence must not be treated as a complete listing.
        skipped:
          type: integer
          minimum: 0
          description: Examined entries omitted because they were links, special files, raced or could not be read. Missing on older servers.
      required:
