        path:
          type: string
          description: Relative sandbox path; empty or "." means the workspace root.
      required:
        - path

    VmWriteResult:
      type: object
      properties:
        path:
          type: string
        sizeBytes:
          type: number
        version:
          type: string
          pattern: "^[a-f0-9]{64}$"
      required:
        - path
        - sizeBytes
        - version

    VmDeleteResult:
      type: object
      properties:
        path:
          type: string
        deleted:
          type: boolean
      required:
        - path
        - deleted

    VmDeletePreviewInput:
      type: object
      additionalProperties: false
      properties:
        path:
          type: string
          minLength: 1
          maxLength: 2048
      required: [path]

    VmDeleteInput:
      type: object
      additionalProperties: false
      properties:
        path:
          type: string
          minLength: 1
          maxLength: 2048
        expectedVersion:
          type: string
          pattern: "^[a-f0-9]{64}$"
          description: Exact version from a fresh deletion preview. Any changed, missing, or unreviewable target requires another inspection. Never automatically retry an uncertain deletion.
      required: [path, expectedVersion]

    VmDeletionPreview:
      type: object
      additionalProperties: false
      properties:
        path:
          type: string
        version:
          type: string
          pattern: "^[a-f0-9]{64}$"
        entryCount:
          type: integer
          minimum: 1
          maximum: 1000
        totalBytes:
          type: integer
          minimum: 0
          maximum: 67108864
        entries:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            type: object
            additionalProperties: false
            properties:
              path:
                type: string
                minLength: 1
                maxLength: 2048
              type:
                type: string
                enum: [file, directory]
              sizeBytes:
                type: integer
                minimum: 0
            required: [path, type, sizeBytes]
      required: [path, version, entryCount, totalBytes, entries]

    VmStatus:
      type: object
      properties:
        agentId:
          type: number
        workspaceId:
          type: string
          description: Stable per-agent workspace identity.
        lifecycle:
          type: string
          enum: [not_created, ready]
        isolation:
          type: string
          enum: [filesystem_sandbox]
          description: Honest isolation boundary; this is not a hardened VM.
        persistent:
          type: boolean
        processExecutionEnabled:
          type: boolean
          description: Whether host process execution was explicitly enabled by the operator.
        exists:
          type: boolean
        cwd:
          type: string
          description: Current persistent virtual working directory.
        totalBytes:
          type: number
        fileCount:
          type: number
        dirCount:
          type: number
      required:
        - agentId
        - workspaceId
        - lifecycle
        - isolation
        - persistent
        - processExecutionEnabled
        - exists
        - cwd
        - totalBytes
        - fileCount
        - dirCount

    OperatorRequestId:
      type: string
      pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"
      maxLength: 36

    OperatorRequestReceipt:
      type: object
      properties:
        requestId:
          $ref: "#/components/schemas/OperatorRequestId"
        agentId:
          type: integer
          minimum: 1
          maximum: 2147483647
        kind:
          type: string
          enum:
            [
              terminal_sandbox,
              terminal_host,
              browser_take_over,
              browser_navigate,
              browser_input,
              browser_release,
              browser_close,
            ]
        state:
          type: string
          enum: [reserved, dispatched, complete, not_dispatched, unknown]
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        dispatchedAt:
          type: [string, "null"]
          format: date-time
        completedAt:
          type: [string, "null"]
          format: date-time
        failureCode:
          type: [string, "null"]
          enum:
            [
              execution_blocked,
              authority_unavailable,
              invalid_session,
              transport_unavailable,
              execution_error,
              deadline_expired,
              server_interrupted,
              null,
            ]
        terminal:
          type: [object, "null"]
          properties:
            ok:
              type: boolean
            exitCode:
              type: [integer, "null"]
            durationMs:
              type: integer
              minimum: 0
          required: [ok, exitCode, durationMs]
        resultAvailability:
          type: string
          enum: [available, unavailable, not_recorded, not_applicable]
        result:
          anyOf:
            - $ref: "#/components/schemas/VmExecResult"
            - type: "null"
      required:
        [
          requestId,
          agentId,
          kind,
          state,
          createdAt,
          expiresAt,
          dispatchedAt,
          completedAt,
          failureCode,
          terminal,
          resultAvailability,
          result,
        ]

    OperatorTerminalResponse:
      type: object
      properties:
        receipt:
          $ref: "#/components/schemas/OperatorRequestReceipt"
        result:
          anyOf:
            - $ref: "#/components/schemas/VmExecResult"
            - type: "null"
      required: [receipt, result]

    OperatorBrowserControlResponse:
      type: object
      properties:
        receipt:
          anyOf:
            - $ref: "#/components/schemas/OperatorRequestReceipt"
            - type: "null"
        result:
          anyOf:
            - $ref: "#/components/schemas/BrowserControlState"
            - type: "null"
      required: [receipt, result]

    OperatorBrowserViewResponse:
      type: object
      properties:
        receipt:
          $ref: "#/components/schemas/OperatorRequestReceipt"
        result:
          anyOf:
            - $ref: "#/components/schemas/BrowserView"
            - type: "null"
      required: [receipt, result]

    OperatorBrowserActionResponse:
      type: object
      properties:
        receipt:
          $ref: "#/components/schemas/OperatorRequestReceipt"
        result:
          anyOf:
            - $ref: "#/components/schemas/VmDeleteResult"
            - type: "null"
      required: [receipt, result]

    VmExecInput:
      type: object
      properties:
        locale:
          type: string
          enum: [tr, en, de, ru, zh-CN, zh-TW, ar]
          description: >
            Language for new application-authored output, captured at submission.
            An explicitly supplied locale is part of the durable request identity.
            Omitted legacy requests preserve their original identity and use Turkish.
            Recorded output and external process output are never translated.
        requestId:
          $ref: "#/components/schemas/OperatorRequestId"
        command:
          type: string
          minLength: 1
          maxLength: 32768
        as:
          type: string
          description: >
            Execution authority. Default "sandbox" runs restricted inside the
            agent workspace; "founder" (operator only) runs through the host
            shell with full authority.
          enum: [sandbox, founder]
      required:
        - requestId
        - command

    VmExecResult:
      type: object
      properties:
        ok:
          type: boolean
        exitCode:
          type: [number, "null"]
        stdout:
          type: string
        stderr:
          type: string
        durationMs:
          type: number
        note:
          type: [string, "null"]
        cwd:
          type: [string, "null"]
          description: Effective working directory after the command.
      required:
        - ok
        - exitCode
        - stdout
        - stderr
        - durationMs
        - note
        - cwd

    BrowserNavigateInput:
      type: object
      properties:
        requestId:
          $ref: "#/components/schemas/OperatorRequestId"
        url:
          type: string
          minLength: 1
          maxLength: 2048
        leaseId:
          type: string
          pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"
          maxLength: 36
          description: Exact active operator control lease returned by take_over.
      required:
        - requestId
        - url
        - leaseId

    BrowserInputAction:
      type: string
      enum: [click, dblclick, move, wheel, keydown, type_text, drag]

    BrowserInputEvent:
      type: object
      properties:
        requestId:
          $ref: "#/components/schemas/OperatorRequestId"
        action:
          $ref: "#/components/schemas/BrowserInputAction"
        x:
          type: number
          minimum: 0
          maximum: 1280
        y:
          type: number
          minimum: 0
          maximum: 800
        deltaX:
          type: number
          minimum: -10000
          maximum: 10000
        deltaY:
          type: number
          minimum: -10000
          maximum: 10000
        key:
          type: string
          minLength: 1
          maxLength: 64
        text:
          type: string
          minLength: 1
          maxLength: 4096
        toX:
          type: number
          minimum: 0
          maximum: 1280
        toY:
          type: number
          minimum: 0
          maximum: 800
        leaseId:
          type: string
          pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"
          maxLength: 36
          description: Exact active operator control lease returned by take_over.
      required:
        - action
        - leaseId
        - requestId

    BrowserControlOwner:
      type: string
      enum: [agent, operator]

    BrowserControlAction:
      type: string
      enum: [take_over, heartbeat, release]

    BrowserControlInput:
      type: object
      properties:
        requestId:
          $ref: "#/components/schemas/OperatorRequestId"
          description: Required for take_over and release; forbidden for heartbeat.
        action:
          $ref: "#/components/schemas/BrowserControlAction"
        leaseId:
          type: [string, "null"]
          pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"
          maxLength: 36
          description: Required for heartbeat and release; omitted for take_over.
      required:
        - action

    BrowserControlState:
      type: object
      properties:
        owner:
          $ref: "#/components/schemas/BrowserControlOwner"
        leaseId:
          type: [string, "null"]
          pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"
          maxLength: 36
        leaseExpiresAt:
          type: [string, "null"]
          format: date-time
        agentActionInFlight:
          type: boolean
      required:
        - owner
        - leaseId
        - leaseExpiresAt
        - agentActionInFlight

    BrowserCloseInput:
      type: object
      properties:
        requestId:
          $ref: "#/components/schemas/OperatorRequestId"
        leaseId:
          type: [string, "null"]
          description: Exact active operator lease when operator-owned; null when agent-owned.
      required:
        - requestId
        - leaseId

    BrowserView:
      type: object
      properties:
        available:
          type: boolean
        pngBase64:
          type: [string, "null"]
        url:
          type: [string, "null"]
        title:
          type: [string, "null"]
        visible:
          type: boolean
          description: Whether the dedicated browser process has a visible OS window.
        control:
          $ref: "#/components/schemas/BrowserControlState"
        width:
          type: number
        height:
          type: number
        note:
          type: [string, "null"]
      required:
        - available
        - pngBase64
        - url
        - title
        - visible
        - control
        - width
        - height
        - note
