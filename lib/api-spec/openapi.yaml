      description: Does not reset usage or grant allowance. Queue transitions and an immutable scope-bound receipt commit together. Explicit replay returns the stored receipt without queueing again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskBudgetResumeInput"
      responses:
        "200":
          description: Durable accepted or rejected budget resume receipt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskBudgetResumeReceipt"
        "400":
          description: Invalid intent
        "409":
          description: Request identity belongs to a different scope

  /tasks/{taskId}/budget-resume/{requestId}:
    get:
      operationId: getTaskBudgetResumeReceipt
